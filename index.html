/* ── WORKOUT DETAIL PUSH ── */
const WorkoutDetail = ({ open, workout, onClose, onStart, customNames = {}, setCustomNames, customItems = {}, setCustomItems, openCatalog }) => {
  const [items, setItems] = useState([]);
  const idCounter = useRef(0);

  // Workout name (editable) — initialized from customNames if present
  const [workoutName, setWorkoutName] = useState("");
  const [editingName, setEditingName] = useState(false);


  const [advancedFor, setAdvancedFor] = useState(null);
  const [groupEditorFor, setGroupEditorFor] = useState(null);

  // Drag-reorder state
  const [draggingIdx, setDraggingIdx] = useState(null);
  const [dragOffsetY, setDragOffsetY] = useState(0);
  const [targetIdx, setTargetIdx] = useState(null);
  const targetIdxRef = useRef(null);

  // Swipe state
  const [activeSwipeIdx, setActiveSwipeIdx] = useState(null);
  const [activeSwipeX, setActiveSwipeX] = useState(0);
  const [revealedIdx, setRevealedIdx] = useState(null);

  // Delete poof state
  const [deletingKey, setDeletingKey] = useState(null);

  const CARD_HEIGHT = 86;
  const swipeBackRef = useRef(null);
  const suppressTapRef = useRef(false); /* guards against drag-end triggering tap */

  useEffect(() => {
    if (workout) {
      idCounter.current = 0;
      const key = workout.name;
      // Use the persisted (edited) item list if we have one, else build from defaults
      const saved = customItems[key];
      if (saved && Array.isArray(saved) && saved.length > 0) {
        // Re-key ids defensively to avoid duplicate-id collisions across reopens
        const maxIdSeen = saved.reduce((m, it) => {
          const n = parseInt(String(it.id || "").replace(/^it-/, ""), 10);
          return Number.isFinite(n) ? Math.max(m, n) : m;
        }, 0);
        idCounter.current = maxIdSeen;
        setItems(saved);
      } else {
        setItems(workout.exercises.map((b) => ({
          id: `it-${++idCounter.current}`,
          ex: b.ex,
          sets: b.sets,
          reps: b.reps ?? null,
          weight: b.weight ?? null,
          restSec: 90,
          durSec: b.durSec ?? null,
          setDetails: null,
          pairedWithIds: [],
          pairType: null,
        })));
      }
      setWorkoutName(customNames[key] || workout.name);
      setEditingName(false);
      /* catalogState lives in App — no longer reset here */
      setAdvancedFor(null); setGroupEditorFor(null);
      setDraggingIdx(null); setActiveSwipeIdx(null); setRevealedIdx(null); setDeletingKey(null);
    }
  }, [workout]);

  // Sync edits back to App state so Today / other screens reflect them immediately.
  // Skipped on the very first render of a fresh workout (the init effect above
  // already wrote-through to local state, no need to bounce it back).
  const itemsSyncSkipRef = useRef(true);
  useEffect(() => {
    if (!workout) return;
    if (itemsSyncSkipRef.current) { itemsSyncSkipRef.current = false; return; }
    if (typeof setCustomItems === "function") {
      setCustomItems(prev => ({ ...prev, [workout.name]: items }));
    }
  }, [items]);
  // Reset the skip flag whenever the workout itself changes
  useEffect(() => { itemsSyncSkipRef.current = true; }, [workout]);

  if (!workout) return <div className={`push ${open?"on":""}`}/>;

  /* Catalog control */

  /* Item handlers */
  const updateItem = (id, field, val) => {
    setItems(prev => prev.map(it => it.id === id ? { ...it, [field]: val } : it));
  };

  const updateSetField = (id, setIdx, field, val) => {
    setItems(prev => prev.map(it => {
      if (it.id !== id) return it;
      const details = (it.setDetails ?? Array.from({ length: it.sets }, () => ({ reps: it.reps, techId: "normal" }))).map(d => ({ ...d }));
      if (!details[setIdx]) details[setIdx] = { reps: it.reps, techId: "normal" };
      details[setIdx][field] = val;
      return { ...it, setDetails: details };
    }));
  };

  const addSet = (id) => {
    setItems(prev => prev.map(it => {
      if (it.id !== id) return it;
      const newSets = it.sets + 1;
      const details = it.setDetails ? [...it.setDetails, { reps: it.reps, techId: "normal" }] : null;
      return { ...it, sets: newSets, setDetails: details };
    }));
  };

  const deleteSet = (id, setIdx) => {
    setItems(prev => prev.map(it => {
      if (it.id !== id || it.sets <= 1) return it;
      const details = (it.setDetails ?? Array.from({ length: it.sets }, () => ({ reps: it.reps, techId: "normal" })));
      const newDetails = [...details.slice(0, setIdx), ...details.slice(setIdx + 1)];
      return { ...it, sets: it.sets - 1, setDetails: newDetails };
    }));
  };

  const setSetTechnique = (id, setIdx, techId) => {
    setItems(prev => prev.map(it => {
      if (it.id !== id) return it;
      const details = (it.setDetails ?? Array.from({ length: it.sets }, () => ({ reps: it.reps, techId: "normal" }))).map(d => ({ ...d }));
      if (!details[setIdx]) details[setIdx] = { reps: it.reps, techId: "normal" };
      details[setIdx].techId = techId;
      return { ...it, setDetails: details };
    }));
  };

  // Per-EXERCISE technique — applies to all sets of that exercise.
  const setItemTechnique = (id, techId) => {
    setItems(prev => prev.map(it => it.id === id ? { ...it, techId } : it));
  };

  /* Group handlers */
  // selectedCatalogEntries: array of CATALOG entries (with { id, name, tab, equipment, type, group })
  const createPairFromCatalog = (primaryId, selectedCatalogEntries, mode) => {
    if (!primaryId || !selectedCatalogEntries || selectedCatalogEntries.length === 0) return;
    // For each selection: find existing item with same name, else create new
    const allPairedIds = [];
    const newItems = [];
    for (const ce of selectedCatalogEntries) {
      const existing = items.find(it => it.ex.name === ce.name && it.id !== primaryId);
      if (existing) {
        allPairedIds.push(existing.id);
      } else {
        const newId = `it-${++idCounter.current}`;
        const ex = catalogToEx(ce);
        newItems.push({
          id: newId, ex,
          sets: 3, reps: ex.type === 'timed' ? null : 10,
          restSec: 90, durSec: ex.type === 'timed' ? 30 : null,
          setDetails: null, pairedWithIds: [], pairType: null,
        });
        allPairedIds.push(newId);
      }
    }
    const allGroupIds = [primaryId, ...allPairedIds];
    setItems(prev => {
      const withNew = [...prev, ...newItems];
      return withNew.map(it => allGroupIds.includes(it.id)
        ? { ...it, pairType: mode, pairedWithIds: allGroupIds.filter(x => x !== it.id) }
        : it
      );
    });
    setAdvancedFor(null);
    setTimeout(() => setGroupEditorFor(primaryId), 360);
  };

  const addMembersFromCatalog = (anyMemberId, selectedCatalogEntries) => {
    const member = items.find(it => it.id === anyMemberId);
    if (!member?.pairType) return;
    const currentMembers = [anyMemberId, ...member.pairedWithIds];
    const addedIds = [];
    const newItems = [];
    for (const ce of selectedCatalogEntries) {
      const existing = items.find(it => it.ex.name === ce.name && !currentMembers.includes(it.id));
      if (existing) {
        addedIds.push(existing.id);
      } else {
        const newId = `it-${++idCounter.current}`;
        const ex = catalogToEx(ce);
        newItems.push({
          id: newId, ex,
          sets: 3, reps: ex.type === 'timed' ? null : 10,
          restSec: 90, durSec: ex.type === 'timed' ? 30 : null,
          setDetails: null, pairedWithIds: [], pairType: null,
        });
        addedIds.push(newId);
      }
    }
    const allMembers = [...currentMembers, ...addedIds];
    setItems(prev => {
      const withNew = [...prev, ...newItems];
      return withNew.map(it => allMembers.includes(it.id)
        ? { ...it, pairType: member.pairType, pairedWithIds: allMembers.filter(x => x !== it.id) }
        : it
      );
    });
  };

  /* Add a single exercise to the workout from catalog */
  const addExerciseFromCatalog = (ce) => {
    const ex = catalogToEx(ce);
    setItems(prev => [...prev, {
      id: `it-${++idCounter.current}`, ex,
      sets: 3, reps: ex.type === 'timed' ? null : 10,
      restSec: 90, durSec: ex.type === 'timed' ? 30 : null,
      setDetails: null, pairedWithIds: [], pairType: null,
    }]);
  };

  /* Swap one item with a catalog exercise */
  const swapItem = (itemId, ce) => {
    const ex = catalogToEx(ce);
    setItems(prev => prev.map(it => it.id === itemId
      ? { ...it, ex,
          // Reset timed/rep fields based on new type
          reps: ex.type === 'timed' ? null : (it.reps ?? 10),
          durSec: ex.type === 'timed' ? (it.durSec ?? 30) : null,
        }
      : it));
  };

  const removeMember = (id) => {
    const item = items.find(it => it.id === id);
    if (!item?.pairType) return;
    const remainingIds = item.pairedWithIds;
    setItems(prev => prev.map(it => {
      if (it.id === id) {
        return { ...it, pairType: null, pairedWithIds: [] };
      }
      if (item.pairedWithIds.includes(it.id)) {
        const newPairs = remainingIds.filter(x => x !== it.id);
        if (newPairs.length === 0) {
          return { ...it, pairType: null, pairedWithIds: [] };
        }
        return { ...it, pairedWithIds: newPairs };
      }
      return it;
    }));
  };

  const dissolveGroup = (anyMemberId) => {
    const item = items.find(it => it.id === anyMemberId);
    if (!item?.pairType) return;
    const memberSet = new Set([anyMemberId, ...item.pairedWithIds]);
    setItems(prev => prev.map(it => memberSet.has(it.id) ? { ...it, pairType: null, pairedWithIds: [] } : it));
  };

  /* Exercise add/delete */
  const deleteItem = (id) => {
    const item = items.find(it => it.id === id);
    if (!item) return;
    setItems(prev => {
      const partnerIds = item.pairedWithIds || [];
      const updated = prev.map(it => {
        if (partnerIds.includes(it.id)) {
          const newPairs = it.pairedWithIds.filter(p => p !== id);
          if (newPairs.length === 0) {
            return { ...it, pairType: null, pairedWithIds: [] };
          }
          return { ...it, pairedWithIds: newPairs };
        }
        return it;
      });
      return updated.filter(it => it.id !== id);
    });
  };

  const deleteGroup = (anyMemberId) => {
    const item = items.find(it => it.id === anyMemberId);
    if (!item?.pairType) return;
    const memberSet = new Set([anyMemberId, ...item.pairedWithIds]);
    setItems(prev => prev.filter(it => !memberSet.has(it.id)));
  };

  /* Compute renderItems */
  const computeRenderItems = (sourceItems) => {
    const result = [];
    const seen = new Set();
    sourceItems.forEach((it) => {
      if (seen.has(it.id)) return;
      if (it.pairType) {
        const groupIds = [it.id, ...it.pairedWithIds];
        const groupMembers = groupIds
          .map(id => sourceItems.find(x => x.id === id))
          .filter(Boolean)
          .sort((a, b) => sourceItems.indexOf(a) - sourceItems.indexOf(b));
        groupIds.forEach(g => seen.add(g));
        result.push({ key: groupIds.join('-'), type: 'group', items: groupMembers, kind: it.pairType, primaryId: it.id, firstItemId: groupMembers[0]?.id });
      } else {
        result.push({ key: it.id, type: 'exercise', item: it, firstItemId: it.id });
        seen.add(it.id);
      }
    });
    return result;
  };

  const renderItems = computeRenderItems(items);

  const reorderRenderItems = (fromRenderIdx, toRenderIdx) => {
    if (fromRenderIdx === toRenderIdx) return;
    setItems(prev => {
      const currentRender = computeRenderItems(prev);
      if (fromRenderIdx >= currentRender.length || toRenderIdx >= currentRender.length) return prev;
      const movingRender = currentRender[fromRenderIdx];
      const movingIds = new Set(
        movingRender.type === 'group'
          ? movingRender.items.map(x => x.id)
          : [movingRender.item.id]
      );
      const movingItems = prev.filter(it => movingIds.has(it.id));
      const remaining = prev.filter(it => !movingIds.has(it.id));
      const remainingRender = computeRenderItems(remaining);
      let adjustedTarget = toRenderIdx;
      if (toRenderIdx > fromRenderIdx) adjustedTarget = toRenderIdx - 1;
      let insertBeforeId = null;
      if (adjustedTarget >= 0 && adjustedTarget < remainingRender.length) {
        insertBeforeId = remainingRender[adjustedTarget].firstItemId;
      }
      let insertIdx;
      if (insertBeforeId === null) {
        insertIdx = remaining.length;
      } else {
        insertIdx = remaining.findIndex(it => it.id === insertBeforeId);
        if (insertIdx === -1) insertIdx = remaining.length;
      }
      return [
        ...remaining.slice(0, insertIdx),
        ...movingItems,
        ...remaining.slice(insertIdx),
      ];
    });
  };

  /* Combined card gesture (tap / swipe / long-press-drag) */
  const beginCardInteraction = (e, renderIdx, onTap) => {
    const target = e.target;
    if (target.closest && (target.closest('[data-interactive]') || target.closest('[data-no-drag]'))) return;

    const startY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
    const startX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
    let mode = 'pending';
    let lastDx = 0;

    if (revealedIdx !== null && revealedIdx !== renderIdx) {
      setRevealedIdx(null);
    }

    const longPressTimer = setTimeout(() => {
      if (mode === 'pending') {
        mode = 'drag';
        setDraggingIdx(renderIdx);
        setDragOffsetY(0);
        targetIdxRef.current = renderIdx;
        setTargetIdx(renderIdx);
      }
    }, 350);

    const onMove = (me) => {
      const y = me.clientY ?? me.touches?.[0]?.clientY ?? 0;
      const x = me.clientX ?? me.touches?.[0]?.clientX ?? 0;
      const dx = x - startX;
      const dy = y - startY;
      lastDx = dx;

      if (mode === 'pending') {
        if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          mode = 'swipe';
          clearTimeout(longPressTimer);
          setActiveSwipeIdx(renderIdx);
          setActiveSwipeX(Math.max(-90, Math.min(0, dx)));
        } else if (Math.abs(dy) > 6) {
          mode = 'cancelled';
          clearTimeout(longPressTimer);
        }
      } else if (mode === 'swipe') {
        setActiveSwipeX(Math.max(-90, Math.min(0, dx)));
      } else if (mode === 'drag') {
        const offset = y - startY;
        setDragOffsetY(offset);
        const slots = Math.round(offset / CARD_HEIGHT);
        const newTarget = Math.max(0, Math.min(renderItems.length - 1, renderIdx + slots));
        targetIdxRef.current = newTarget;
        setTargetIdx(newTarget);
      }
    };

    const onEnd = () => {
      clearTimeout(longPressTimer);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onEnd);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onEnd);

      if (mode === 'pending') {
        if (revealedIdx === renderIdx) {
          setRevealedIdx(null);
        } else {
          onTap();
        }
      } else if (mode === 'swipe') {
        if (lastDx < -45) {
          setRevealedIdx(renderIdx);
        } else {
          setRevealedIdx(null);
        }
        setActiveSwipeIdx(null);
        setActiveSwipeX(0);
      } else if (mode === 'drag') {
        const finalTarget = targetIdxRef.current ?? renderIdx;
        if (finalTarget !== renderIdx) {
          reorderRenderItems(renderIdx, finalTarget);
        }
        setDraggingIdx(null);
        setDragOffsetY(0);
        setTargetIdx(null);
        targetIdxRef.current = null;
        suppressTapRef.current = true;
        setTimeout(() => { suppressTapRef.current = false; }, 300);
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd);
  };

  const onCardTap = (rit) => {
    if (suppressTapRef.current) return; /* drag just ended — ignore */
    if (rit.type === 'group') {
      setGroupEditorFor(rit.primaryId);
    } else {
      setAdvancedFor(rit.item.id);
    }
  };

  const onCardDelete = (renderIdx) => {
    const rit = renderItems[renderIdx];
    if (!rit) return;
    setDeletingKey(rit.key);
    setRevealedIdx(null);
    setTimeout(() => {
      if (rit.type === 'group') deleteGroup(rit.primaryId);
      else deleteItem(rit.item.id);
      setDeletingKey(null);
    }, 260);
  };

  return (
    <div
      className={`push ${open?"on":""}`}
      style={{ background:"#E5E6E9" }}
      onTouchStart={(e) => {
        if (advancedFor !== null || groupEditorFor !== null) return;
        const t = e.touches[0];
        if (t.clientX > 24) return;
        swipeBackRef.current = { x: t.clientX, y: t.clientY };
      }}
      onTouchMove={(e) => {
        if (!swipeBackRef.current) return;
        const t = e.touches[0];
        const dx = t.clientX - swipeBackRef.current.x;
        const dy = Math.abs(t.clientY - swipeBackRef.current.y);
        if (dx > 44 && dy < 40) { swipeBackRef.current = null; onClose(); }
      }}
      onTouchEnd={() => { swipeBackRef.current = null; }}
    >

      <svg style={{ position:"absolute", inset:0, width:"100%", height:"100%", zIndex:0, pointerEvents:"none" }}
           viewBox="0 0 393 852" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs>
          <filter id="pc2" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1.5" dy="4" stdDeviation="5.5" flood-color="#8C8E96" flood-opacity="0.17"/>
          </filter>
          <filter id="pcs2" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1" dy="2.5" stdDeviation="4" flood-color="#8C8E96" flood-opacity="0.13"/>
          </filter>
        </defs>
        <path d="M 403 -10 L 403 310 C 380 294 350 318 322 298 C 294 278 298 232 272 206 C 246 180 215 196 198 169 C 181 142 196 96 222 66 C 248 36 335 -10 403 -10 Z" fill="#F0F0F3" filter="url(#pc2)"/>
        <path d="M -10 175 L -10 435 C 26 415 68 442 92 414 C 116 386 104 340 130 316 C 156 292 182 306 192 280 C 202 254 184 218 165 200 C 146 182 72 172 -10 175 Z" fill="#EDEEF2" filter="url(#pc2)"/>
        <path d="M 403 390 L 403 648 C 380 632 353 656 326 642 C 299 628 292 592 272 572 C 252 552 228 562 215 536 C 202 510 216 478 238 462 C 260 446 286 456 307 440 C 328 424 336 392 360 379 C 378 370 403 378 403 378 Z" fill="#F2F2F5" filter="url(#pc2)"/>
        <path d="M -10 512 L -10 862 L 272 862 L 272 826 C 236 806 200 830 163 817 C 126 804 100 766 62 770 C 38 772 8 786 -10 776 Z" fill="#EDEEF2" filter="url(#pc2)"/>
        <path d="M 306 862 L 403 862 L 403 688 C 390 676 370 692 352 682 C 334 672 324 649 305 656 C 291 661 285 682 288 740 Z" fill="#F0F0F3" filter="url(#pc2)"/>
        <path d="M -10 -10 L 95 -10 C 106 18 92 62 70 87 C 48 112 18 100 -2 144 C -8 158 -10 163 -10 152 Z" fill="#F4F4F7" filter="url(#pcs2)"/>
        <path d="M 240 300 C 272 272 320 282 338 316 C 356 350 340 394 306 402 C 272 410 228 386 222 350 C 216 318 222 314 240 300 Z" fill="#F4F4F7" filter="url(#pcs2)"/>
        <path d="M 140 560 C 158 538 188 543 196 566 C 204 589 188 612 164 607 C 140 602 124 582 140 560 Z" fill="#F8F8FA" filter="url(#pcs2)"/>
      </svg>

      <SBar/>
      <div style={{ position:"absolute", top:"var(--safe-top)", left:0, right:0, bottom:0, zIndex:1 }}>

        <div className="scroll notab">

          <div style={{ textAlign:"center", padding:"32px 24px 0" }}>
            {editingName ? (
              <input
                value={workoutName}
                onChange={(e) => setWorkoutName(e.target.value)}
                onBlur={() => {
                  const finalName = workoutName.trim() || workout.name;
                  setWorkoutName(finalName);
                  setEditingName(false);
                  if (typeof setCustomNames === "function") {
                    setCustomNames(prev => {
                      const key = workout.name;
                      if (finalName === workout.name) {
                        // Reset to default — drop the custom entry
                        const { [key]: _, ...rest } = prev;
                        return rest;
                      }
                      return { ...prev, [key]: finalName };
                    });
                  }
                }}
                onKeyDown={(e) => {
                  if (e.key === "Enter") {
                    e.currentTarget.blur();
                  }
                }}
                autoFocus
                style={{
                  fontFamily:"var(--f-os)", fontSize:58, fontWeight:700, textTransform:"uppercase",
                  color:"var(--ink)", lineHeight:0.9, letterSpacing:"0.01em",
                  background:"transparent", border:"none", outline:"none",
                  textAlign:"center", width:"100%",
                  borderBottom:"2px solid var(--blue)",
                  padding:"0 0 4px",
                }}
              />
            ) : (
              <div onClick={() => setEditingName(true)}
                style={{
                  fontFamily:"var(--f-os)", fontSize:58, fontWeight:700, textTransform:"uppercase",
                  color:"var(--ink)", lineHeight:0.9, letterSpacing:"0.01em",
                  cursor:"text",
                }}>
                {workoutName}
              </div>
            )}
            <div style={{ marginTop:12, fontSize:13, color:"var(--ink3)", letterSpacing:"0.04em" }}>
              {(items.length > 0 ? computeBroadMuscles(items) : workout.muscles).join("  ·  ") || "—"}
            </div>
            <div style={{ marginTop:18, fontSize:12, color:"var(--ink3)", fontStyle:"italic", letterSpacing:"0.02em" }}>
              Tap to edit &nbsp;·&nbsp; SWAP to replace &nbsp;·&nbsp; Hold to reorder &nbsp;·&nbsp; Swipe to delete
            </div>
          </div>

          <div style={{ height:26 }} />

          <div style={{ padding:"0 30px" }}>
            {renderItems.map((rit, idx) => {
              const isDragging = draggingIdx === idx;

              // Displacement for non-dragging cards during a drag
              let displaceY = 0;
              if (!isDragging && draggingIdx !== null && targetIdx !== null) {
                const origIdx = draggingIdx, target = targetIdx;
                if (target > origIdx && idx > origIdx && idx <= target) displaceY = -CARD_HEIGHT;
                else if (target < origIdx && idx >= target && idx < origIdx) displaceY = CARD_HEIGHT;
              }

              // X-only swipe offset for delete reveal
              let swipeX = 0;
              if (activeSwipeIdx === idx) swipeX = activeSwipeX;
              else if (revealedIdx === idx) swipeX = -75;

              const isStandalone = rit.type === 'exercise';

              return (
                // OUTER WRAPPER — all Y movement lives here (drag + displacement) + poof
                <div key={rit.key}
                  className={deletingKey === rit.key ? 'card-poof' : ''}
                  style={{
                    position:"relative", marginBottom: 9,
                    borderRadius: 18,
                    overflow: isDragging ? "visible" : "hidden",
                    transform: isDragging
                      ? `translateY(${dragOffsetY}px) scale(1.04)`
                      : (displaceY !== 0 ? `translateY(${displaceY}px)` : undefined),
                    transition: (isDragging || activeSwipeIdx === idx) ? "none" : "transform 0.24s cubic-bezier(0.32,0.72,0,1)",
                    zIndex: isDragging ? 50 : 1,
                    boxShadow: isDragging ? "0 16px 36px rgba(0,0,0,0.24)" : undefined,
                  }}>

                  {/* Red delete background — width follows the swipe so Delete is centered in the visible area */}
                  <div style={{
                    position:"absolute", top:0, bottom:0, right:0,
                    width: Math.max(0, -swipeX),
                    borderTopRightRadius:18, borderBottomRightRadius:18,
                    background:"#D94040",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    overflow:"hidden",
                  }}>
                    <button
                      data-interactive="true"
                      onClick={() => onCardDelete(idx)}
                      style={{ color:"#fff", fontFamily:"var(--f-os)", fontSize:12, fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", background:"none", border:"none", cursor:"pointer", padding:0 }}
                    >
                      Delete
                    </button>
                  </div>

                  {/* INNER CARD — X-only movement (swipe to reveal) */}
                  <div
                    onMouseDown={(e) => beginCardInteraction(e, idx, () => onCardTap(rit))}
                    onTouchStart={(e) => beginCardInteraction(e, idx, () => onCardTap(rit))}
                    style={{
                      transform: `translateX(${swipeX}px)`,
                      transition: activeSwipeIdx === idx ? "none" : "transform 0.24s cubic-bezier(0.32,0.72,0,1)",
                      borderRadius:18,
                      touchAction:"pan-y",
                    }}
                  >
                    {isStandalone ? (
                       <div style={{
                         background:"var(--white)", borderRadius:18,
                         border:"2px solid var(--ink)",
                         boxShadow:"0 4px 16px rgba(10,10,15,0.10)",
                         cursor:"pointer",
                         display:"flex", alignItems:"stretch",
                         minHeight:100, overflow:"hidden",
                       }}>
                         {/* Left: name + muscle */}
                         <div style={{ flex:1, padding:"16px 10px 16px 18px", display:"flex", flexDirection:"column", justifyContent:"center", gap:3 }}>
                           <div style={{ fontFamily:"var(--f-os)", fontSize:19, fontWeight:600, textTransform:"uppercase", color:"var(--ink)", letterSpacing:"0.04em", lineHeight:1.2 }}>
                             {rit.item.ex.name}
                           </div>
                           {rit.item.ex.muscles && rit.item.ex.muscles[0] ? (
                             <div style={{ fontSize:13, color:"var(--ink2)", fontFamily:"var(--f-sys)" }}>
                               {rit.item.ex.muscles[0]}
                             </div>
                           ) : null}
                         </div>
                         {/* Soft divider */}
                         <div style={{ width:1, background:"var(--line)", margin:"14px 0" }}/>
                         {/* Right: metric summary + SWAP */}
                         <div style={{ width:120, padding:"14px 14px 14px 12px", display:"flex", flexDirection:"column", justifyContent:"center", gap:4, background:"rgba(10,10,15,0.02)" }}>
                           <div style={{ fontFamily:"var(--f-os)", fontSize:36, fontWeight:700, color:"var(--ink)", lineHeight:1 }}>
                             {rit.item.sets} × {(rit.item.ex.type === "timed" || rit.item.durSec) ? `${rit.item.durSec||0}s` : (rit.item.reps || "—")}
                           </div>
                           <div style={{ fontSize:13, color:"var(--ink2)", fontFamily:"var(--f-sys)" }}>
                             {(rit.item.restSec ?? 90)}s rest
                           </div>
                           <button
                             data-interactive="true"
                             onClick={(ev) => {
                               ev.stopPropagation();
                               openCatalog({
                                 mode:"single",
                                 title:`Swap ${rit.item.ex.name}`,
                                 subtitle:`Replacing ${rit.item.ex.name}`,
                                 sourceItem: rit.item,
                                 excludeNames: items.filter(x => x.id !== rit.item.id).map(x => x.ex.name),
                                 workoutName: workoutName,
                                 onPick: (ce) => swapItem(rit.item.id, ce),
                               });
                             }}
                             style={{ marginTop:6, alignSelf:"flex-start", background:"var(--ink)", color:"#fff", border:"none", borderRadius:6, padding:"5px 9px", fontFamily:"var(--f-os)", fontSize:10, fontWeight:700, letterSpacing:"0.12em", textTransform:"uppercase", cursor:"pointer", WebkitTapHighlightColor:"transparent" }}>
                             SWAP
                           </button>
                         </div>
                       </div>
                    ) : (
                      // GROUP CARD — left blue bar is the only blue; labels use ink/ink2
                      <div style={{
                        background:"var(--white)", borderRadius:18,
                        border:"2px solid var(--ink)",
                        boxShadow:"0 3px 14px rgba(10,10,15,0.08)",
                        cursor:"pointer", overflow:"hidden",
                        position:"relative",
                      }}>
                        <div style={{ position:"absolute", left:0, top:0, bottom:0, width:4, background:"var(--blue)" }}/>

                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 14px 0 18px" }}>
                          <div style={{ fontFamily:"var(--f-os)", fontSize:11, fontWeight:700, textTransform:"uppercase", color:"var(--ink2)", letterSpacing:"0.2em" }}>
                            {rit.kind === "superset" ? "Superset" : "Circuit"}
                          </div>
                          <div style={{ fontSize:10, color:"var(--ink3)" }}>{rit.items.length} exercises</div>
                        </div>

                        <div style={{ height:1, background:"var(--line)", margin:"8px 14px 0 18px" }} />

                        <div style={{ padding:"6px 14px 4px 18px" }}>
                          {rit.items.map((memIt, slotIdx) => {
                            const letter = String.fromCharCode(65 + slotIdx);
                            const isTimed = memIt.ex.type === "timed" || !!memIt.durSec;
                            const repsOrTime = isTimed ? `${memIt.durSec||0}s` : (memIt.reps||0);
                            return (
                              <div key={memIt.id} style={{ display:"flex", alignItems:"center", padding:"5px 0" }}>
                                <span style={{ fontFamily:"var(--f-os)", fontSize:11, fontWeight:700, color:"var(--ink3)", width:18 }}>{letter}</span>
                                <span style={{ fontFamily:"var(--f-os)", fontSize:14, fontWeight:700, textTransform:"uppercase", color:"var(--ink)", letterSpacing:"0.03em", flex:1 }}>
                                  {memIt.ex.name}
                                </span>
                                <span style={{ fontFamily:"var(--f-os)", fontSize:13, fontWeight:600, color:"var(--ink2)" }}>
                                  {memIt.sets} × {repsOrTime}
                                </span>
                              </div>
                            );
                          })}
                        </div>

                        <div style={{ height:1, background:"var(--line)", margin:"4px 14px 0 18px" }} />

                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"7px 14px 8px 18px" }}>
                          <span style={{ fontSize:11, color:"var(--ink3)" }}>
                            {items.find(it => it.id === rit.primaryId)?.restSec ?? 90}s between rounds
                          </span>
                          <span style={{ fontSize:12, fontWeight:500, color:"var(--ink2)", display:"flex", alignItems:"center", gap:2 }}>
                            Edit
                            <Icon name="ChevronRight" size={12} color="var(--ink2)" sw={2.2}/>
                          </span>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}

            {/* Add Exercise */}
            <button
              onClick={() => openCatalog({
                mode: "multi",
                title: "Add Exercises",
                excludeNames: items.map(it => it.ex.name),
                onConfirm: (selectedCatalogEntries) => {
                  selectedCatalogEntries.forEach(ce => addExerciseFromCatalog(ce));
                },
              })}
              style={{
                width:"100%", marginTop:14, padding:"20px 16px",
                background:"transparent", border:"2px dashed var(--ink3)", borderRadius:18,
                cursor:"pointer", color:"var(--ink)",
                fontFamily:"var(--f-os)", fontSize:13, fontWeight:700,
                letterSpacing:"0.14em", textTransform:"uppercase",
                display:"flex", alignItems:"center", justifyContent:"center",
              }}>
              ADD EXERCISE
            </button>
          </div>

          <div style={{ height:48 }} />
        </div>

        <AdvancedSheet
          open={advancedFor !== null}
          itemId={advancedFor}
          items={items}
          openCatalog={openCatalog}
          workoutName={workoutName}
          updateItem={updateItem}
          updateSetField={updateSetField}
          addSet={addSet}
          deleteSet={deleteSet}
          setItemTechnique={setItemTechnique}
          onCreatePair={createPairFromCatalog}
          onClose={() => setAdvancedFor(null)}
        />

        <GroupEditor
          open={groupEditorFor !== null}
          primaryId={groupEditorFor}
          items={items}
          openCatalog={openCatalog}
          workoutName={workoutName}
          updateItem={updateItem}
          updateSetField={updateSetField}
          addSet={addSet}
          deleteSet={deleteSet}
          setItemTechnique={setItemTechnique}
          addMembersFromCatalog={addMembersFromCatalog}
          removeMember={removeMember}
          dissolveGroup={dissolveGroup}
          onClose={() => setGroupEditorFor(null)}
        />

      </div>

      {/* Catalog must live OUTSIDE the top:54 inner container so it fully
          covers the WorkoutDetail SBar — otherwise we double-stack status bars */}
    </div>
  );
};



/* ── ACTIVE WORKOUT ── */
const ExerciseIcon = ({ block, done }) => {
  const type = block.ex.type;
  if (done) {
    return (
      <div className="ex-icon done" style={{ background:"#fff" }}>
        <Icon name="Check" size={20} color="var(--d-bg)" sw={3}/>
      </div>
    );
  }
  if (type==="timed") {
    return (
      <div className="ex-icon timed">
        <Icon name="Clock" size={20} color="rgba(255,255,255,0.6)" sw={1.8}/>
      </div>
    );
  }
  if (!block.reps && block.sets > 1) {
    return (
      <div className="ex-icon active">
        <Icon name="RefreshCw" size={18} color="rgba(255,255,255,0.6)" sw={2}/>
      </div>
    );
  }
  return (
    <div className="ex-icon pending" style={{ borderRadius:10, width:44, height:44, border:"2px solid rgba(255,255,255,0.15)" }}>
    </div>
  );
};

const ActiveWorkout = ({ open, workout, onClose, customNames = {}, customItems = {} }) => {
  const [done, setDone] = useState({});
  const [sec, setSec]   = useState(0);

  useEffect(() => {
    if (!open) { setDone({}); setSec(0); return; }
    const id = setInterval(() => setSec(s=>s+1), 1000);
    return () => clearInterval(id);
  }, [open]);

  const fmt = (s) => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const w = workout || LEGS;
  // Use live customItems if available; otherwise fall back to static exercises.
  const rawExs = customItems[w.name] || w.exercises;
  // Normalize: both formats have .ex.name; customItems items have .sets, .reps, etc.
  const exs = rawExs.map(e => ({ ex: e.ex, sets: e.sets || 3, reps: e.reps || null, durSec: e.durSec || null }));
  const displayName = customNames[w.name] || w.name;
  const doneCount = Object.values(done).filter(Boolean).length;
  const nextIdx = exs.findIndex((_,i)=>!done[i]);

  return (
    <div className={`fsmodal ${open?"on":""}`}>
      <SBar/>
      <div style={{ position:"absolute", top:"var(--safe-top)", left:0, right:0, bottom:0 }}>

        {/* Top bar */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 24px 0" }}>
          <button onClick={onClose} className="tap" style={{ background:"none", border:"none", cursor:"pointer" }}>
            <Icon name="ChevronDown" size={24} color="#fff" sw={2}/>
          </button>
          <span style={{ fontFamily:"var(--f-sys)", fontSize:12, color:"rgba(255,255,255,0.35)", letterSpacing:"0.04em" }}>
            {doneCount} / {exs.length}
          </span>
          <button
            onClick={onClose}
            className="tap"
            style={{ padding:"9px 20px", borderRadius:30, background:"var(--d-surf)", border:"1px solid rgba(255,255,255,0.1)", color:"#fff", fontFamily:"var(--f-sys)", fontSize:15, fontWeight:600, cursor:"pointer" }}
          >
            Finish
          </button>
        </div>

        {/* Timer + name */}
        <div style={{ padding:"28px 24px 0" }}>
          <div style={{ fontFamily:"var(--f-os)", fontSize:76, fontWeight:300, lineHeight:1, color:"#fff", fontVariantNumeric:"tabular-nums", letterSpacing:"-0.01em" }}>
            {fmt(sec)}
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:8 }}>
            <span style={{ fontFamily:"var(--f-os)", fontSize:17, fontWeight:700, textTransform:"uppercase", color:"#fff", letterSpacing:"0.04em" }}>{displayName}</span>
            <span style={{ fontSize:15, color:"rgba(255,255,255,0.35)" }}>· In progress</span>
          </div>
        </div>

        <div style={{ height:20 }} />

        {/* Exercise list */}
        <div style={{ overflowY:"auto", maxHeight:"calc(100% - 285px)" }}>
          {exs.map((b,i)=>{
            const isDone = !!done[i];
            return (
              <div key={i}>
                <button
                  className="tap"
                  style={{ display:"flex", alignItems:"center", gap:16, padding:"14px 24px", width:"100%", textAlign:"left", background:"none", border:"none", cursor:"pointer" }}
                  onClick={()=>setDone({...done,[i]:!isDone})}
                >
                  <ExerciseIcon block={b} done={isDone}/>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:17, fontWeight:600, color: isDone?"rgba(255,255,255,0.3)":"#fff", transition:"color 0.2s ease" }}>
                      {b.ex.name}
                    </div>
                    <div style={{ fontSize:13, marginTop:2, color: isDone?"rgba(255,255,255,0.18)":"rgba(255,255,255,0.45)", transition:"color 0.2s ease" }}>
                      {b.sets > 1
                        ? `${isDone ? b.sets : "0"} of ${b.sets} sets ${isDone?"completed":"·  tap to log"}`
                        : fmtVol(b)
                      }
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:12, alignItems:"center" }}>
                    <span style={{ fontSize:18, letterSpacing:"0.06em", color:"rgba(255,255,255,0.18)", fontWeight:700 }}>···</span>
                    <Icon name="ChevronRight" size={14} color="rgba(255,255,255,0.15)" sw={2.5}/>
                  </div>
                </button>
                {i<exs.length-1 && <div style={{ height:1, background:"var(--d-line)", margin:"0 24px" }} />}
              </div>
            );
          })}
        </div>

        {/* Bottom bar — Up next */}
        {nextIdx !== -1 && (
          <div style={{
            position:"absolute", bottom:0, left:0, right:0,
            padding:"16px 20px 32px",
            background:"var(--d-surf)",
            boxShadow:"0 -1px 0 rgba(255,255,255,0.06), 0 -20px 40px rgba(0,0,0,0.5)",
            display:"flex", alignItems:"center", gap:14,
          }}>
            <div className="ex-icon active">
              <Icon name="ChevronRight" size={18} color="var(--blue)" sw={2.5}/>
            </div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:17, fontWeight:700, color:"#fff" }}>{exs[nextIdx].ex.name}</div>
              <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)", marginTop:1 }}>Up next</div>
            </div>
            <button
              className="tap"
              onClick={()=>setDone({...done,[nextIdx]:true})}
              style={{
                display:"flex", alignItems:"center", gap:8,
                padding:"11px 20px", borderRadius:30,
                background:"rgba(255,255,255,0.1)", border:"none",
                color:"#fff", fontFamily:"var(--f-sys)", fontSize:15, fontWeight:600,
                cursor:"pointer", letterSpacing:"0.02em",
              }}
            >
              Next
              <Icon name="ArrowRight" size={16} color="#fff" sw={2.2}/>
            </button>
          </div>
        )}
      </div>
    </div>
  );
};

/* ── PROFILE ── */
const ProfileScreen = () => {
  const [photos, setPhotos] = useState(true);
  const [prompt, setPrompt] = useState(true);

  const Toggle = ({on, onChange}) => (
    <button
      onClick={()=>onChange(!on)}
      style={{
        width:51, height:31, borderRadius:16, position:"relative",
        background: on?"var(--blue)":"rgba(120,120,128,0.2)",
        border:"none", cursor:"pointer", flexShrink:0,
        transition:"background 0.22s ease",
      }}
    >
      <div style={{
        position:"absolute", top:2, width:27, height:27,
        background:"#fff", borderRadius:14,
        left: on?"22px":"2px",
        transition:"left 0.22s cubic-bezier(0.32,0.72,0,1)",
        boxShadow:"0 2px 8px rgba(0,0,0,0.18)",
      }}/>
    </button>
  );

  const Row = ({label, value, on, onChange, last}) => (
    <>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 16px" }}>
        <span style={{ fontSize:15, color:"var(--ink)" }}>{label}</span>
        {onChange ? <Toggle on={on} onChange={onChange}/> : <span style={{ fontSize:14, color:"var(--ink2)" }}>{value}</span>}
      </div>
      {!last && <div style={{ height:1, background:"var(--line)", margin:"0 16px" }}/>}
    </>
  );

  return (
    <div className="scroll">
      <div style={{ padding:"8px 24px 20px" }}>
        <div style={{ fontFamily:"var(--f-os)", fontSize:44, fontWeight:700, textTransform:"uppercase", color:"var(--ink)", lineHeight:1 }}>
          Profile
        </div>
      </div>

      {/* Identity */}
      <div style={{ margin:"0 20px 16px" }}>
        <div className="card" style={{ padding:"16px", display:"flex", alignItems:"center", gap:14 }}>
          <div style={{ width:56, height:56, borderRadius:28, background:"var(--blue-lt)", display:"flex", alignItems:"center", justifyContent:"center" }}>
            <span style={{ fontFamily:"var(--f-os)", fontSize:22, fontWeight:700, color:"var(--blue)" }}>A</span>
          </div>
          <div>
            <div style={{ fontSize:16, fontWeight:600, color:"var(--ink)" }}>Alex</div>
            <div style={{ fontSize:13, color:"var(--ink2)", marginTop:2 }}>Intermediate</div>
          </div>
        </div>
      </div>

      {[
        { title:"Goals", rows:[{label:"Weekly Target",value:"4 sessions"},{label:"Fitness Level",value:"Intermediate",last:true}]},
      ].map((sec,si)=>(
        <div key={si} style={{ margin:"0 0 16px" }}>
          <div style={{ padding:"0 24px 8px", fontSize:12, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:"var(--ink3)" }}>{sec.title}</div>
          <div style={{ margin:"0 20px" }} className="card">
            {sec.rows.map((r,ri)=><Row key={ri} {...r}/>)}
          </div>
        </div>
      ))}

      <div style={{ margin:"0 0 16px" }}>
        <div style={{ padding:"0 24px 8px", fontSize:12, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:"var(--ink3)" }}>Workout Photos</div>
        <div style={{ margin:"0 20px" }} className="card">
          <Row label="Enable Photos" on={photos} onChange={setPhotos}/>
          {photos && <Row label="Prompt at Start & End" on={prompt} onChange={setPrompt} last/>}
          {!photos && <div style={{ height:1 }}/>}
        </div>
      </div>

      <div style={{ margin:"0 0 16px" }}>
        <div style={{ padding:"0 24px 8px", fontSize:12, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:"var(--ink3)" }}>Activity</div>
        <div style={{ margin:"0 20px" }} className="card">
          <Row label="Current Streak" value="12 days"/>
          <Row label="Weekly Progress" value="2 / 4" last/>
        </div>
      </div>

      <div style={{ margin:"0 0 16px" }}>
        <div style={{ padding:"0 24px 8px", fontSize:12, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:"var(--ink3)" }}>App</div>
        <div style={{ margin:"0 20px" }} className="card">
          <Row label="Version" value="1.0.0 dev"/>
          <Row label="Account" value="Coming soon" last/>
        </div>
      </div>

      <div style={{ height:48 }}/>
    </div>

};

/* ── TABS ── */
const Tabs = ({ active, onChange }) => (
  <div className="tabs">
    {[["today","Today","Home"],["schedule","Schedule","Calendar"],["profile","Profile","User"]].map(([id,label,icon])=>(
      <div key={id} className={`tab ${active===id?"on":""}`} onClick={()=>onChange(id)}>
        <Icon name={icon} size={26} sw={active===id?2.6:1.8}/>
        <span>{label}</span>
      </div>
    ))}
  </div>
);

/* ── APP ── */
const App = () => {
  const [tab,    setTab]    = useState("today");
  const [active, setActive] = useState(false);
  const [month,  setMonth]  = useState(false);
  const [day,    setDay]    = useState(false);
  const [selDay, setSelDay] = useState(null);
  const [detail, setDetail] = useState(false);
  const [selWkt, setSelWkt] = useState(LEGS);

  // Persistent custom state per workout (keyed by original workout.name).
  // Renames go into customNames; edited exercise lists go into customItems.
  // Today reads both; WorkoutDetail reads and writes both.
  const [customNames, setCustomNames] = useState({});
  const [customItems, setCustomItems] = useState({});

  // Catalog state lifted to App level so CatalogScreen renders outside WorkoutDetail's
  // transform context and can always cover the full viewport.
  const [catalogState, setCatalogState] = useState({ open: false });
  const openCatalog = (opts) => setCatalogState({ open: true, ...opts });
  const closeCatalog = () => setCatalogState({ open: false });

  return (
    <>
      <SBar/>
      <div className="area">
        <div style={{ display:tab==="today"?"block":"none", height:"100%" }}>
          <TodayScreen
            customNames={customNames}
            customItems={customItems}
            onStart={()=>{ setSelWkt(LEGS); setActive(true); }}
            onOpenDetail={(w)=>{ setSelWkt(w); setDetail(true); }}
          />
        </div>
        <div style={{ display:tab==="schedule"?"block":"none", height:"100%" }}>
          <ScheduleScreen
            customNames={customNames}
            customItems={customItems}
            onOpenMonth={()=>setMonth(true)}
            onOpenDay={(d)=>{ setSelDay(d); setDay(true); }}
            onOpenDetail={(w)=>{ setSelWkt(w); setDetail(true); }}
          />
        </div>
        <div style={{ display:tab==="profile"?"block":"none", height:"100%" }}>
          <ProfileScreen/>
        </div>
      </div>

      <Tabs active={tab} onChange={setTab}/>

      <div className={`backdrop ${month?"on":""}`} onClick={()=>setMonth(false)}/>
      <MonthSheet open={month} onClose={()=>setMonth(false)}
        onSelectDay={(d)=>{ setSelDay({day:`May ${d}`,status:"completed",workout:PUSH}); setDay(true); }}/>

      <div className={`backdrop ${day?"on":""}`} onClick={()=>setDay(false)}/>
      <DaySheet open={day} day={selDay}
        customNames={customNames}
        customItems={customItems}
        onOpenDetail={(w)=>{ setDay(false); setTimeout(()=>{ setSelWkt(w); setDetail(true); }, 200); }}
        onClose={()=>setDay(false)}/>

      <WorkoutDetail open={detail} workout={selWkt}
        customNames={customNames}
        setCustomNames={setCustomNames}
        customItems={customItems}
        setCustomItems={setCustomItems}
        openCatalog={openCatalog}
        onClose={()=>setDetail(false)}
        onStart={()=>{ setDetail(false); setTimeout(()=>setActive(true),200); }}/>

      <ActiveWorkout open={active} workout={selWkt}
        customNames={customNames}
        customItems={customItems}
        onClose={()=>setActive(false)}/>

      {/* Catalog at App level — position:absolute here resolves to .app-viewport,
          not inside WorkoutDetail's transform context. This fixes the clipping bug. */}
      <CatalogScreen
        open={catalogState.open}
        mode={catalogState.mode}
        title={catalogState.title}
        subtitle={catalogState.subtitle || ""}
        sourceItem={catalogState.sourceItem || null}
        excludeNames={catalogState.excludeNames || []}
        workoutName={catalogState.workoutName || ""}
        onPick={catalogState.onPick}
        onConfirm={catalogState.onConfirm}
        onClose={closeCatalog}
      />
    </>
  );
};

/* ── ERROR BOUNDARY ── catches React render/effect errors so users see
   a readable message in #root instead of only the blank wallpaper SVG */
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(e) { return { err: e.message || String(e) }; }
  componentDidCatch(e, info) { console.error("[Paced ErrorBoundary]", e, info); }
  render() {
    if (this.state.err) {
      return (
        <div style={{ padding:"40px 24px", fontFamily:"system-ui", maxWidth:380, margin:"0 auto" }}>
          <div style={{ color:"#D94040", fontWeight:700, fontSize:18, marginBottom:8 }}>
            App Error
          </div>
          <div style={{ color:"#333", fontSize:14, marginBottom:12, wordBreak:"break-word" }}>
            {this.state.err}
          </div>
          <div style={{ color:"#888", fontSize:12 }}>
            Open browser console for full details.
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App/></ErrorBoundary>
);
</script>
</body>
</html>
