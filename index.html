<html lang="en">
<head>

<title>Paced</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
* { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --white:      #FFFFFF;
  --bg:         #F8F8FA;
  --ink:        #0A0A0F;
  --ink2:       #58595F;
  --ink3:       #9B9DA6;
  --ink4:       #C8CAD2;
  --blue:       #2F6FED;
  --blue-lt:    rgba(47,111,237,0.12);
  --blue-md:    rgba(47,111,237,0.55);
  --line:       rgba(10,10,15,0.08);
  --missed:     #D94040;
  --d-bg:       #0A0A0E;
  --d-surf:     #161618;
  --d-line:     rgba(255,255,255,0.07);
  --f-os:       'Oswald', 'Arial Narrow', sans-serif;
  --f-sys:      -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
}

html, body {
  font-family: var(--f-sys);
  background: #111114;
  height: 100%; overflow: hidden;
}
body {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  background: radial-gradient(ellipse at center, #1e1e22, #0e0e11);
  padding: 24px;
}

.helper {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  font-family: var(--f-os); font-size: 11px; font-weight: 500;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(255,255,255,0.28); pointer-events: none;
}

/* PHONE */
.shell {
  width: 393px; height: 852px;
  border-radius: 56px; background: #080809; padding: 7px;
  box-shadow:
    0 0 0 1.5px #28282c,
    inset 0 0 0 1px rgba(255,255,255,0.04),
    0 60px 140px -30px rgba(0,0,0,0.8);
  flex-shrink: 0;
}
.screen {
  width: 100%; height: 100%;
  border-radius: 50px; overflow: hidden;
  background: #E5E6E9; position: relative;
}

/* Dynamic Island */
.island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
  width: 122px; height: 36px; background: #000;
  border-radius: 20px; z-index: 100; pointer-events: none;
}

/* STATUS BAR */
.sbar {
  height: 54px; padding: 18px 34px 0;
  display: flex; justify-content: space-between; align-items: center;
  font-size: 16px; font-weight: 600; color: var(--ink);
  pointer-events: none; position: relative; z-index: 10;
  font-family: var(--f-sys);
}
.sbar.dark { color: #fff; }
.sbar-icons { display: flex; gap: 5px; align-items: center; }

/* HOME INDICATOR */
.hi {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
  width: 134px; height: 5px; border-radius: 3px;
  background: var(--ink); opacity: 0.8; z-index: 50;
}
.hi.dark { background: #fff; opacity: 0.55; }

/* SCREEN AREA */
.area {
  position: absolute; top: 54px; left: 0; right: 0; bottom: 0;
  overflow: hidden; z-index: 5;
}

/* SCROLL */
.scroll {
  height: 100%; overflow-y: auto; overflow-x: hidden;
  padding-bottom: 100px; scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }
.scroll.notab { padding-bottom: 28px; }
.shell *::-webkit-scrollbar { display: none; }

/* TAB BAR */
.tabs {
  position: absolute; bottom: 0; left: 0; right: 0; height: 84px;
  background: rgba(229,230,233,0.88);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-top: 1px solid rgba(10,10,15,0.07);
  display: flex; align-items: flex-start; justify-content: space-around;
  padding-top: 10px; z-index: 40;
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 4px 20px; cursor: pointer; user-select: none;
  color: var(--ink3);
  transition: color 0.18s ease;
  -webkit-tap-highlight-color: transparent;
}
.tab.on { color: var(--blue); }
.tab:active { opacity: 0.7; }
.tab span {
  font-family: var(--f-os); font-size: 10px; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase;
}

/* CARDS */
.card {
  background: var(--white);
  border-radius: 18px;
  box-shadow: 0 2px 18px rgba(10,10,15,0.08), 0 1px 4px rgba(10,10,15,0.04);
}
.card-inner {
  background: var(--white);
  border-radius: 12px;
  box-shadow: 0 1px 8px rgba(10,10,15,0.06);
}

/* PILL */
.pill {
  display: inline-flex; align-items: center;
  padding: 4px 10px;
  background: var(--blue-lt);
  color: var(--blue);
  border-radius: 20px;
  font-family: var(--f-sys);
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
}

/* CTA */
.cta {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 58px;
  background: var(--ink); color: #fff;
  border-radius: 30px; border: none;
  font-family: var(--f-os); font-size: 18px;
  font-weight: 600; letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 8px 28px rgba(10,10,15,0.3);
  transition: transform 0.12s ease, opacity 0.12s ease;
  -webkit-tap-highlight-color: transparent;
}
.cta:active { transform: scale(0.985); opacity: 0.93; }

/* STREAK GRID */
.grid-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.grid-cell {
  height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: transform 0.12s ease;
}

/* SHEETS */
.backdrop {
  position: absolute; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 80; opacity: 0; pointer-events: none;
  transition: opacity 0.28s ease;
}
.backdrop.on { opacity: 1; pointer-events: auto; }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; top: 56px;
  background: #E5E6E9;
  border-radius: 16px 16px 0 0;
  z-index: 90;
  transform: translateY(100%);
  transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
  box-shadow: 0 -20px 60px rgba(0,0,0,0.2);
}
.sheet.on { transform: translateY(0); }
.handle {
  width: 36px; height: 5px; background: var(--ink4);
  border-radius: 3px; margin: 8px auto 0;
}

/* FULL SCREEN */
.fsmodal {
  position: absolute; inset: 0; background: var(--d-bg);
  z-index: 110; border-radius: 50px;
  transform: translateY(100%);
  transition: transform 0.40s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
}
.fsmodal.on { transform: translateY(0); }

/* PUSH */
.push {
  position: absolute; inset: 0; background: #E5E6E9;
  z-index: 70;
  transform: translateX(100%);
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
  overflow: hidden;
}
.push.on { transform: translateX(0); }

/* EXPAND */
.expand {
  overflow: hidden;
  transition: max-height 0.38s cubic-bezier(0.32,0.72,0,1),
              opacity 0.28s ease;
}

/* TAP */
.tap { transition: transform 0.12s ease, opacity 0.12s ease; -webkit-tap-highlight-color: transparent; cursor: pointer; }
.tap:active { transform: scale(0.97); opacity: 0.9; }

/* CARD POOF — delete animation */
@keyframes card-poof {
  0%   { transform: scale(1);    opacity: 1; }
  28%  { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(0.55); opacity: 0; }
}
.card-poof { animation: card-poof 0.27s cubic-bezier(0.4,0,0.2,1) forwards; pointer-events: none; }

/* DARK EXERCISE ICON */
.ex-icon {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ex-icon.done { background: #fff; }
.ex-icon.pending { background: var(--d-surf); border: 2px solid rgba(255,255,255,0.12); border-radius: 10px; width: 44px; height: 44px; }
.ex-icon.active { background: var(--d-surf); }
.ex-icon.timed  { background: var(--d-surf); }
</style>
</head>

/* Decode a row index into a full exercise object. The shape (.name, .tab, .type, .equipment) matches catalogToEx. */
const unpackCatalog = (idx) => {
  const r = CATALOG_BUNDLE.rows[idx];
  if (!r) return null;
  return {
    id: idx,
    name: r[0],
    tab: CATALOG_BUNDLE.tabs[r[1]],
    primary: r[2],
    secondary: r[3],
    equipment: CATALOG_BUNDLE.equipment[r[4]],
    base: CATALOG_BUNDLE.bases[r[5]],
    setup: CATALOG_BUNDLE.setups[r[6]],
    type: r[7] === 1 ? "timed" : "reps",
  };
};

/* Precompute row indices grouped by tab (for O(1) tab switching) */
const CATALOG_BY_TAB = (() => {
  const map = {};
  CATALOG_BUNDLE.tabs.forEach(t => { map[t] = []; });
  CATALOG_BUNDLE.rows.forEach((r, i) => {
    const tab = CATALOG_BUNDLE.tabs[r[1]];
    map[tab].push(i);
  });
  return map;
})();

/* User-facing tab order — pushed/pulled by frequency-of-use rather than alphabetical */
const CATALOG_TABS_ORDERED = ["Chest","Back","Shoulders","Biceps","Triceps","Forearms","Quads","Hamstrings","Glutes","Calves","Core","Cardio","Power"];

/* Foundational base exercises per tab — used for "Suggested for X Day" rows.
   The picker finds the simplest variant of each base in catalog. */
const FOUNDATIONAL_BASES = {
  Chest:      ["Bench Press", "Push-Up", "Chest Fly", "Chest Dip"],
  Back:       ["Deadlift", "Pull-Up/Chin-Up", "Row", "Lat Pulldown"],
  Shoulders:  ["Shoulder Press", "Lateral Raise", "Face Pull"],
  Biceps:     ["Curl", "Hammer Curl"],
  Triceps:    ["Triceps Pushdown", "Skull Crusher", "Overhead Triceps Extension"],
  Forearms:   ["Wrist Curl", "Reverse Curl"],
  Quads:      ["Squat", "Leg Press", "Lunge", "Leg Extension"],
  Hamstrings: ["Leg Curl", "Deadlift"],
  Glutes:     ["Hip Thrust", "Split Squat"],
  Calves:     ["Calf Raise"],
  Core:       ["Plank", "Crunch", "Leg Raise", "Pallof Press"],
  Cardio:     ["Treadmill Run", "Stationary Bike Upright", "Row Erg", "Treadmill Walk"],
  Power:      ["Clean", "Snatch"],
};

/* Match the workout name to target muscle tabs */
const tabsForWorkoutName = (workoutName) => {
  const n = (workoutName || "").toLowerCase();
  if (/leg|lower|squat/.test(n))     return ["Quads","Hamstrings","Glutes","Calves"];
  if (/\bpush\b/.test(n))          return ["Chest","Shoulders","Triceps"];
  if (/\bpull\b/.test(n))          return ["Back","Biceps"];
  if (/back/.test(n))                return ["Back","Biceps"];
  if (/chest/.test(n))               return ["Chest","Triceps"];
  if (/shoulder|delt/.test(n))       return ["Shoulders"];
  if (/bicep/.test(n))               return ["Biceps"];
  if (/tricep/.test(n))              return ["Triceps"];
  if (/arm/.test(n))                 return ["Biceps","Triceps"];
  if (/core|\babs?\b/.test(n))     return ["Core"];
  if (/cardio|run/.test(n))          return ["Cardio"];
  if (/upper/.test(n))               return ["Chest","Back","Shoulders"];
  if (/full|total/.test(n))          return ["Chest","Back","Quads"];
  return [];
};

/* Build foundational suggestions for a workout name, filtered against current exercises */
const buildSuggestions = (workoutName, excludeNames, max = 6) => {
  const targets = tabsForWorkoutName(workoutName);
  if (targets.length === 0) return [];
  const excludeSet = new Set(excludeNames || []);
  const seenBases = new Set();
  const results = [];
  const preferredSetups = ["", "Flat", "Standard", "Conventional", "Standing", "Lying", "Seated", "Bilateral"];
  for (const tab of targets) {
    const bases = FOUNDATIONAL_BASES[tab] || [];
    for (const base of bases) {
      if (results.length >= max) break;
      const candidates = (CATALOG_BY_TAB[tab] || [])
        .map(i => unpackCatalog(i))
        .filter(c => c && c.base === base && !excludeSet.has(c.name));
      if (candidates.length === 0) continue;
      const preferred = candidates.find(c => preferredSetups.includes(c.setup)) || candidates[0];
      results.push(preferred);
      seenBases.add(`${tab}|${base}`);
    }
    if (results.length >= max) break;
  }
  return results;
};

/* Convert a catalog entry into an `ex` object matching EX shape. Used by WorkoutDetail handlers. */
function catalogToEx(ce) {
  return { name: ce.name, muscles: [ce.tab], type: ce.type, equipment: ce.equipment };
}

/* ── BROAD MUSCLE GROUPS ──
   Used on Full Details to summarize what the workout actually trains, derived live
   from the current items[]. Specific muscle tabs (Quads, Hamstrings, Glutes, Calves)
   collapse into "Legs", arms (Biceps, Triceps, Forearms) collapse into "Arms", etc.
   The display follows BROAD_MUSCLE_ORDER. */
const BROAD_MUSCLE_MAP = {
  Chest: "Chest",
  Back: "Back", Lats: "Back",
  Shoulders: "Shoulders",
  "Front Delts": "Shoulders", "Side Delts": "Shoulders", "Rear Delts": "Shoulders",
  Biceps: "Arms", Triceps: "Arms", Forearms: "Arms",
  Quads: "Legs", Hamstrings: "Legs", Glutes: "Legs", Calves: "Legs", Legs: "Legs",
  Core: "Core", Abs: "Core",
  Cardio: "Cardio",
  Power: "Power",
};
const BROAD_MUSCLE_ORDER = ["Chest", "Back", "Shoulders", "Arms", "Legs", "Core", "Cardio", "Power"];
const computeBroadMuscles = (items) => {
  const set = new Set();
  for (const it of items) {
    const muscles = it.ex?.muscles || [];
    for (const m of muscles) {
      const broad = BROAD_MUSCLE_MAP[m];
      if (broad) set.add(broad);
    }
  }
  return BROAD_MUSCLE_ORDER.filter(g => set.has(g));
};

/* ── BROAD TABS (Chest, Back, Legs, Shoulders, Arms, Core, Cardio) ──
   These are the user-facing primary tabs. Each broad tab can be refined
   by exact muscle (sub-filter) AND by equipment. */
const BROAD_TAB_FROM_SPECIFIC = {
  Chest: "Chest",
  Back: "Back",
  Shoulders: "Shoulders",
  Biceps: "Arms", Triceps: "Arms", Forearms: "Arms",
  Quads: "Legs", Hamstrings: "Legs", Glutes: "Legs", Calves: "Legs",
  Core: "Core",
  Cardio: "Cardio", Power: "Cardio",
};
const CATALOG_BROAD_TABS = ["Chest", "Back", "Legs", "Shoulders", "Arms", "Core", "Cardio"];

// Precompute row indices per broad tab
const CATALOG_BY_BROAD = (() => {
  const map = {};
  CATALOG_BROAD_TABS.forEach(t => { map[t] = []; });
  CATALOG_BUNDLE.rows.forEach((r, i) => {
    const specific = CATALOG_BUNDLE.tabs[r[1]];
    const broad = BROAD_TAB_FROM_SPECIFIC[specific];
    if (broad) map[broad].push(i);

    const primary = r[2].toLowerCase();

    // ── Cross-categorization pass ──
    // Some exercises live in one category in the source data but their primary
    // muscle target means lifters expect them in a different category too.

    // Back → Legs
    // All 54 deadlift variants are labeled "Back" (they heavily load spinal erectors)
    // but primary says "Glutes, hamstrings, spinal erectors". A lifter browsing
    // Legs > Hamstrings expects every deadlift style to appear there.
    if (broad === "Back" && /hamstring|glute|quadricep/.test(primary)) {
      map["Legs"].push(i);
    }

    // Power (Cardio) → Legs
    // 56 Olympic lift variations (Clean, Snatch, Jerk, Thruster) are filed under
    // Power → Cardio. Every single one has quads/glutes/hamstrings in primary.
    // Lifters programming a strength or leg day with power cleans need them here.
    if (broad === "Cardio" && specific === "Power" && /quad|glute|hamstring/.test(primary)) {
      map["Legs"].push(i);
    }

    // Power (Cardio) → Back
    // Cleans and Snatches also heavily target traps and upper back. Cross-list
    // into Back so they appear when browsing Back > Traps or searching "clean".
    if (broad === "Cardio" && specific === "Power" && /trap/.test(primary)) {
      map["Back"].push(i);
    }
  });
  return map;
})();

/* ── SEARCH ALIASES ──
   Maps gym shorthand to terms that appear in catalog fields.
   
   Critical: do NOT include "lat" as an alias for anything — it is a substring of
   "flat", "lateral", "plantarflexion", etc. and produces false positives.
   Use "latissimus" + "lat pulldown" instead.
   Removed broad group terms (back/chest/legs/shoulders/arms) — those are handled
   by the tab field in the haystack already.  */
const SEARCH_ALIASES = {
  // Muscle abbreviations
  "lats":          ["latissimus", "lat pulldown"],   // lat pulldown → catches "Lat Pulldown" base
  "tris":          ["tricep"],                        // prefix-matches "triceps" ✓
  "bis":           ["bicep"],                         // prefix-matches "biceps" ✓
  "pecs":          ["pectoral"],                      // prefix-matches "pectoralis" ✓
  "delts":         ["deltoid"],
  "traps":         ["trapezius"],

  "hams":          ["hamstring"],
  "glutes":        ["gluteus", "glutes"],
  "calves":        ["gastrocnemius", "soleus"],
  "abs":           ["abdominal", "rectus abdominis"],
  "obliques":      ["oblique"],
  // Exercise shorthand
  "rdl":           ["romanian"],
  "sldl":          ["stiff-leg"],
  "ohp":           ["overhead press", "shoulder press"],
  "cgbp":          ["close-grip"],
  "db":            ["dumbbell"],
  "bb":            ["barbell"],
  "ez":            ["ez-bar"],
  "bw":            ["bodyweight"],

  // Specific muscle combos
  "rear delts":    ["posterior deltoid"],
  "rear delt":     ["posterior deltoid"],
  "side delts":    ["lateral deltoid", "medial deltoid"],
  "front delts":   ["anterior deltoid"],
  "lower back":    ["erector spinae", "spinal erector"],
  "upper back":    ["rhomboid", "trapezius"],
};

/* Escape special regex characters in a search term */
const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/* ── BUILD SEARCH MATCHER ──
   Improvements over the previous version:

   1. Multi-word AND logic  — "tricep pushdown" splits to ["tricep", "pushdown"]
      and BOTH must match. No more zero results for two-word queries.

   2. Word-boundary on BOTH sides for short terms (≤4 chars)  — "lat" with just
      \b prefix still matches the substring in "flat" and "lateral" because there
      IS a word boundary at the START of "flat"/"lateral". Adding \b at the END
      too means "lat" only matches "lat" as a standalone word (e.g. "Lat Pulldown"
      where "Lat" is followed by a space — a boundary). "lateral" has "e" after
      "lat", so no boundary there. Fixed.

   3. Relevance scoring  — exercises where the query matches the PRIMARY muscle or
      the NAME rank above those where it only matches SECONDARY muscles or equipment.
      "lats" returns latissimus-focused exercises first, not exercises that happen
      to use lats as a stabilizer.                                              */
const buildSearchMatcher = (q) => {
  const raw = q.toLowerCase().trim();
  if (!raw) return null;

  const words = raw.split(/\s+/).filter(Boolean);
  if (words.length === 0) return null;

  // Build regex set per query word
  const wordRegexSets = words.map(word => {
    const candidates = new Set([word]);
    (SEARCH_ALIASES[word] || []).forEach(a => candidates.add(a.toLowerCase()));
    return [...candidates].map(c => {
      const prefix = "\\b";
      // For terms ≤4 chars, require a word boundary on the right side too.
      // This prevents "lat" from matching "flat", "glute" from matching "gluteus"
      // at a false position, "core" from matching "decorator", etc.
      const suffix = c.length <= 4 ? "\\b" : "";
      return new RegExp(prefix + escapeRegex(c) + suffix, "i");
    });
  });

  const buildHay = (c) =>
    `${c.name} ${c.tab} ${c.primary} ${c.secondary} ${c.equipment} ${c.base} ${c.setup}`;

  // Matcher: all word groups must match somewhere in the haystack
  const matcher = (c) => {
    const hay = buildHay(c);
    return wordRegexSets.every(rxs => rxs.some(rx => rx.test(hay)));
  };

  // Scorer: higher = more relevant. Primary muscle match outweighs name, name outweighs tab.
  const scorer = (c) => {
    let s = 0;
    for (const rxs of wordRegexSets) {
      if (rxs.some(rx => rx.test(c.primary)))    s += 10; // primary muscle match — most relevant
      if (rxs.some(rx => rx.test(c.name)))       s += 6;  // name match
      if (rxs.some(rx => rx.test(c.tab)))        s += 4;  // broad category
      if (rxs.some(rx => rx.test(c.base)))       s += 2;  // base exercise name
      // secondary, equipment, setup: still searchable, just no bonus score
    }
    return s;
  };

  return { matcher, scorer };
};

/* ── Pick the default broad tab based on workout name ── */
const broadTabsForWorkoutName = (workoutName) => {
  const n = (workoutName || "").toLowerCase();
  if (/leg|lower|squat/.test(n))      return ["Legs"];
  if (/\bpush\b/.test(n))              return ["Chest", "Shoulders", "Arms"];
  if (/\bpull\b/.test(n))              return ["Back", "Arms"];
  if (/back/.test(n))                  return ["Back", "Arms"];
  if (/chest/.test(n))                 return ["Chest", "Arms"];
  if (/shoulder|delt/.test(n))         return ["Shoulders"];
  if (/arm|bicep|tricep/.test(n))      return ["Arms"];
  if (/core|\babs?\b/.test(n))         return ["Core"];
  if (/cardio|run/.test(n))            return ["Cardio"];
  if (/upper/.test(n))                 return ["Chest", "Back", "Shoulders", "Arms"];
  if (/full|total/.test(n))            return ["Legs", "Chest", "Back"];
  return [];
};

/* ── CATALOG SCREEN ── */
const CatalogScreen = ({ open, mode, title, excludeNames = [], workoutName = "", onPick, onConfirm, onClose }) => {
  const defaultTab = (() => {
    const list = broadTabsForWorkoutName(workoutName);
    return (list && list.length > 0 && CATALOG_BROAD_TABS.includes(list[0])) ? list[0] : "Chest";
  })();

  const [query, setQuery] = useState("");
  const [activeTab, setActiveTab] = useState(defaultTab);
  const [activeSub, setActiveSub] = useState(0);
  const [activeEq, setActiveEq] = useState(0);
  const [selected, setSelected] = useState([]);

  const tabRefs = useRef({});
  const subRefs = useRef({});
  const bodyRef = useRef(null);

  // Reset state each time the screen opens
  useEffect(() => {
    if (open) {
      setQuery("");
      setActiveTab(defaultTab);
      setActiveSub(0);
      setActiveEq(0);
      setSelected([]);
    }
  }, [open, defaultTab]);

  // Reset sub-filter when broad tab changes; scroll body to top on any filter change
  useEffect(() => { setActiveSub(0); }, [activeTab]);
  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = 0;
  }, [activeTab, activeSub, activeEq, query]);

  // Auto-scroll the active tab into view
  useEffect(() => {
    if (!open) return;
    const el = tabRefs.current[activeTab];
    if (el && el.scrollIntoView) {
      requestAnimationFrame(() => {
        el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
      });
    }
  }, [activeTab, open]);

  useEffect(() => {
    if (!open) return;
    const el = subRefs.current[activeSub];
    if (el && el.scrollIntoView) {
      requestAnimationFrame(() => {
        el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
      });
    }
  }, [activeSub, activeTab, open]);

  const isMulti = mode === "multi";
  const excludeSet = new Set(excludeNames);
  const subs = BROAD_SUBS[activeTab] || [{ name: "All", fn: () => true }];
  const currentSubFn = subs[activeSub]?.fn || (() => true);
  const currentEqFn = EQUIPMENT_GROUPS[activeEq]?.match || (() => true);

  // Compute visible indices
  const visibleIndices = (() => {
    const q = query.trim();
    const searchResult = q ? buildSearchMatcher(q) : null;

    if (searchResult) {
      const { matcher, scorer } = searchResult;
      // Collect ALL matches first, then sort by relevance.
      // Primary-muscle matches rank above secondary/equipment hits so that
      // "lats" returns lat-focused exercises before ones that merely use lats
      // as a stabilizer.
      const scored = [];
      for (let i = 0; i < CATALOG_BUNDLE.rows.length; i++) {
        const c = unpackCatalog(i);
        if (!matcher(c)) continue;
        if (activeEq !== 0 && !currentEqFn(c)) continue;
        scored.push([i, scorer(c)]);
      }
      scored.sort((a, b) => b[1] - a[1]);
      return scored.slice(0, 250).map(x => x[0]);
    }

    // No query — apply broad tab + sub-filter + equipment
    let list = CATALOG_BY_BROAD[activeTab] || [];
    if (activeSub !== 0) list = list.filter(i => currentSubFn(unpackCatalog(i)));
    if (activeEq !== 0) list = list.filter(i => currentEqFn(unpackCatalog(i)));
    return list;
  })();

  // Suggestions visible only on default state
  const showSuggestions = !query && activeTab === defaultTab && activeSub === 0 && activeEq === 0;
  const suggestions = showSuggestions ? buildSuggestions(workoutName, excludeNames, 5) : [];

  const toggle = (id) => {
    setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };
  const handleTap = (ex) => {
    if (isMulti) toggle(ex.id);
    else { onPick && onPick(ex); onClose(); }
  };
  const handleConfirm = () => {
    const picked = selected.map(id => unpackCatalog(id)).filter(Boolean);
    if (picked.length > 0 && onConfirm) onConfirm(picked);
    onClose();
  };

  const visibleCap = 200;
  const overflow = visibleIndices.length > visibleCap ? visibleIndices.length - visibleCap : 0;
  const renderList = visibleIndices.slice(0, visibleCap);

  // System sans for body, Oswald reserved for the top title
  const BODY_FONT = '-apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif';
  const sectionLabel = query
    ? `${visibleIndices.length} result${visibleIndices.length !== 1 ? 's' : ''}`
    : (activeSub === 0 ? `All ${activeTab}` : `${activeTab} · ${subs[activeSub].name}`);

  return (
    <div className={`push ${open?"on":""}`} style={{ background:"#E5E6E9", fontFamily: BODY_FONT }}>

      {/* Topographic wallpaper — same family as Today / Full Details */}
      <svg style={{ position:"absolute", inset:0, width:"100%", height:"100%", zIndex:0, pointerEvents:"none" }}
           viewBox="0 0 393 852" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs>
          <filter id="pcc" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1.5" dy="4" stdDeviation="5.5" flood-color="#8C8E96" flood-opacity="0.17"/>
          </filter>
          <filter id="pccs" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1" dy="2.5" stdDeviation="4" flood-color="#8C8E96" flood-opacity="0.13"/>
          </filter>
        </defs>
        <path d="M -10 -10 L -10 268 C 28 248 78 268 110 240 C 142 212 130 162 162 134 C 194 106 226 124 240 96 C 254 68 218 30 168 8 C 118 -14 30 -10 -10 -10 Z"
              fill="#EDEEF2" filter="url(#pcc)"/>
        <path d="M 240 -10 L 403 -10 L 403 22 C 380 26 350 48 330 78 C 310 108 320 148 300 178 C 280 208 244 192 226 226 C 208 260 226 296 252 314 C 246 280 246 220 250 168 C 254 116 246 50 240 -10 Z"
              fill="#F0F0F3" filter="url(#pcc)"/>
        <path d="M -10 195 L -10 312 C 40 300 95 320 120 296 C 142 274 120 246 120 222 C 120 206 80 196 50 196 C 30 196 5 198 -10 195 Z"
              fill="#F2F2F5" filter="url(#pccs)"/>
        <path d="M 285 248 C 305 230 333 235 340 256 C 347 277 333 298 312 295 C 291 292 273 268 285 248 Z"
              fill="#F4F4F7" filter="url(#pccs)"/>
      </svg>

      <SBar/>

      {/* Inner column. zIndex:1 floats over the SVG wallpaper. */}
      <div style={{
        position:"absolute", top:54, left:0, right:0, bottom:0,
        display:"flex", flexDirection:"column", zIndex:1,
      }}>

        {/* Header: back + selection count */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between",
                      padding:"6px 14px 4px 10px", flexShrink: 0 }}>
          <button onClick={onClose} className="tap"
            style={{ display:"flex", alignItems:"center", gap:2, background:"none", border:"none",
                     cursor:"pointer", padding:"6px 8px" }}>
            <Icon name="ChevronLeft" size={20} color="var(--ink)" sw={2.2}/>
            <span style={{ fontSize:15, color:"var(--ink)", fontWeight:500 }}>Back</span>
          </button>
          {isMulti && selected.length > 0 ? (
            <span style={{ fontSize:12, fontWeight:600, color:"var(--blue)" }}>
              {selected.length} selected
            </span>
          ) : (
            <div style={{ width:60 }}/>
          )}
        </div>

        {/* Centered title — OSWALD, uppercase */}
        <div style={{ padding:"6px 20px 14px", textAlign:"center", flexShrink: 0 }}>
          <h1 style={{
            margin:0,
            fontFamily:"var(--f-os)",
            fontSize:28, fontWeight:700,
            textTransform:"uppercase",
            color:"var(--ink)",
            letterSpacing:"0.02em", lineHeight:1.0,
          }}>
            {title || (isMulti ? "Add Exercises" : "Add Exercise")}
          </h1>
        </div>

        {/* Search */}
        <div style={{ padding:"0 20px 12px", flexShrink: 0 }}>
          <SearchInput value={query} onChange={setQuery} placeholder="Search name, muscle, equipment"/>
        </div>

        {/* Broad tabs (hidden during search) */}
        {!query && (
          <TabStrip tabs={CATALOG_BROAD_TABS} active={activeTab} onSelect={setActiveTab} tabRefs={tabRefs}/>
        )}

        {/* Exact-muscle sub-filter (hidden during search) */}
        {!query && subs.length > 1 && (
          <SubFilterStrip filters={subs} activeIdx={activeSub} onSelect={setActiveSub} refsHolder={subRefs}/>
        )}

        {/* Equipment strip — always visible */}
        <EquipmentStrip groups={EQUIPMENT_GROUPS} activeIdx={activeEq} onSelect={setActiveEq}/>

        {/* BODY — solid white, scrollable */}
        <div ref={bodyRef} style={{
          flex:1, minHeight:0,
          overflowY:"auto", overflowX:"hidden",
          background:"#FFFFFF",
        }}>

          {/* Suggestions */}
          {suggestions.length > 0 && (
            <div style={{ borderBottom:"8px solid #E5E6E9" }}>
              <div style={{ padding:"14px 20px 6px",
                            fontSize:11, fontWeight:600, letterSpacing:"0.18em",
                            textTransform:"uppercase", color:"var(--ink3)" }}>
                Suggested for {workoutName}
              </div>
              {suggestions.map(ex => (
                <CatalogRow key={`sug-${ex.id}`}
                  ex={ex}
                  isMulti={isMulti}
                  selected={selected.includes(ex.id)}
                  inWorkout={excludeSet.has(ex.name)}
                  onTap={() => handleTap(ex)}/>
              ))}
            </div>
          )}

          {/* Section header */}
          <div style={{ padding:"14px 20px 6px",
                        fontSize:11, fontWeight:600, letterSpacing:"0.18em",
                        textTransform:"uppercase", color:"var(--ink3)" }}>
            {sectionLabel}
            {activeEq !== 0 && !query && (
              <span style={{ color:"var(--ink3)", fontWeight:400, textTransform:"none", letterSpacing:0, marginLeft:8 }}>
                · {EQUIPMENT_GROUPS[activeEq].name.toLowerCase()} only
              </span>
            )}
          </div>

          {/* Empty state — POLISHED, never blank */}
          {visibleIndices.length === 0 && (
            <div style={{ padding:"56px 28px 40px", textAlign:"center" }}>
              <div style={{
                width:54, height:54, borderRadius:27, margin:"0 auto 16px",
                background:"rgba(10,10,15,0.04)", display:"flex",
                alignItems:"center", justifyContent:"center",
              }}>
                <Icon name="Search" size={22} color="var(--ink3)" sw={2}/>
              </div>
              <div style={{ fontSize:15, fontWeight:500, color:"var(--ink)" }}>
                {query ? "No matches" : "Nothing in this filter"}
              </div>
              <div style={{ fontSize:13, color:"var(--ink3)", marginTop:4, lineHeight:1.4 }}>
                {query
                  ? "Try a different word, or check spelling."
                  : (activeEq !== 0
                      ? `Try a different equipment filter, or browse all ${activeTab.toLowerCase()}.`
                      : `Try a different muscle.`)}
              </div>
            </div>
          )}

          {/* List */}
          {renderList.map(id => {
            const ex = unpackCatalog(id);
            if (!ex) return null;
            return (
              <CatalogRow key={id}
                ex={ex}
                isMulti={isMulti}
                selected={selected.includes(ex.id)}
                inWorkout={excludeSet.has(ex.name)}
                onTap={() => handleTap(ex)}/>
            );
          })}

          {overflow > 0 && (
            <div style={{ padding:"18px 20px 28px", fontSize:12, color:"var(--ink3)",
                          textAlign:"center", borderBottom:"1px solid var(--line)" }}>
              +{overflow.toLocaleString()} more — refine your search to narrow results
            </div>
          )}

          {/* Bottom safe area */}
          <div style={{ height: isMulti ? 110 : 36 }}/>
        </div>

        {/* Multi-select CTA */}
        {isMulti && (
          <div style={{
            position:"absolute", left:0, right:0, bottom:0,
            padding:"14px 20px 28px",
            background:"linear-gradient(to top, #FFFFFF 60%, rgba(255,255,255,0.6) 90%, rgba(255,255,255,0))",
            transform: selected.length > 0 ? "translateY(0)" : "translateY(110%)",
            transition:"transform 0.28s cubic-bezier(0.32,0.72,0,1)",
            pointerEvents: selected.length > 0 ? "auto" : "none",
          }}>
            <button onClick={handleConfirm}
              style={{
                width:"100%", padding:"15px 20px",
                background:"var(--ink)", color:"#fff", border:"none", borderRadius:14,
                cursor:"pointer", fontFamily:"var(--f-os)", fontSize:13, fontWeight:700,
                letterSpacing:"0.16em", textTransform:"uppercase",
                display:"flex", alignItems:"center", justifyContent:"center", gap:8,
                boxShadow:"0 8px 22px rgba(0,0,0,0.18)",
              }}>
              Add {selected.length} exercise{selected.length !== 1 ? "s" : ""}
              <Icon name="ArrowRight" size={15} color="#fff" sw={2.2}/>
            </button>
          </div>
        )}

      </div>
    </div>
  );
};

  {day:"Mon",letter:"M",date:18,workout:PUSH,   status:"completed"},
  {day:"Tue",letter:"T",date:19,workout:PULL,   status:"completed"},
  {day:"Wed",letter:"W",date:20,workout:null,   status:"rest"},
  {day:"Thu",letter:"T",date:21,workout:LEGS,   status:"scheduled",isToday:true},
  {day:"Fri",letter:"F",date:22,workout:PUSH,   status:"scheduled"},
  {day:"Sat",letter:"S",date:23,workout:CARDIO, status:"scheduled"},
  {day:"Sun",letter:"S",date:24,workout:null,   status:"rest"},
];

const fmtVol = (b) => {
  if (b.durSec) { const m=Math.floor(b.durSec/60),s=b.durSec%60; return `${b.sets} × ${m>0?`${m}m`:""}${s>0?`${s}s`:""}`; }
  if (b.reps)   return b.weight ? `${b.sets} × ${b.reps}  ·  ${b.weight} lbs` : `${b.sets} × ${b.reps}`;
  return `${b.sets} sets`;
};

// Renders exactly like streaks.jpg: big number, context, month grid
const StreakCalendar = () => {
  // Build a 5-week grid representing current month context
  // Week rows: past 3 weeks + this week + next week
  // Each cell: day index, status
  const today = { week: 3, day: 3 }; // 0-indexed, week 3 = this week, day 3 = Thursday

  // status per cell: "done"|"rest"|"today"|"scheduled"|"empty"|"missed"
  const grid = [
    // week 0 (3 weeks ago)
    ["done","done","rest","done","done","rest","rest"],
    // week 1
    ["done","missed","rest","done","done","rest","rest"],
    // week 2
    ["done","done","rest","done","done","rest","rest"],
    // this week (week 3) — Mon done, Tue done, Wed rest, Thu=today, Fri–Sun scheduled/rest
    ["done","done","rest","today","scheduled","scheduled","rest"],
    // next week — all empty
    ["empty","empty","empty","empty","empty","empty","empty"],
  ];

  const cellColor = (s) => {
    switch(s) {
      case "done":      return "#2F6FED";
      case "missed":    return "rgba(217,64,64,0.7)";
      case "today":     return "#2F6FED";
      case "scheduled": return "rgba(47,111,237,0.14)";
      case "rest":      return "rgba(10,10,15,0.06)";
      default:          return "rgba(10,10,15,0.03)";

  return (
    <div>
      {/* Streak number */}
      <div style={{ display:"flex", alignItems:"baseline", gap:8 }}>
        <span style={{ fontFamily:"var(--f-os)", fontSize:56, fontWeight:700, lineHeight:1, color:"var(--blue)" }}>
          {STREAK}
        </span>
        <span style={{ fontFamily:"var(--f-sys)", fontSize:22, fontWeight:400, color:"var(--ink)", lineHeight:1 }}>
          Day Streak
        </span>
      </div>

      {/* Divider */}
      <div style={{ height:1, background:"var(--line)", margin:"16px 0" }} />

      {/* Context sentence */}
      <p style={{ fontFamily:"var(--f-sys)", fontSize:17, lineHeight:1.5, color:"var(--ink3)" }}>
        Today, a{" "}
        <span style={{ color:"var(--ink)", fontWeight:600 }}>Legs</span>
        {" "}workout is scheduled. You have{" "}
        <span style={{ color:"var(--ink)", fontWeight:600 }}>5 rest days</span>
        {" "}remaining this month.
      </p>

      <div style={{ height:20 }} />

      {/* Day header row */}
      <div className="grid-week" style={{ marginBottom:5 }}>
        {["M","T","W","T","F","S","S"].map((l,i)=>(
          <div key={i} style={{ textAlign:"center", fontFamily:"var(--f-sys)", fontSize:12, fontWeight:500, color:"var(--ink3)" }}>
            {l}
          </div>
        ))}
      </div>

      {/* Grid */}
      <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
        {grid.map((row,ri)=>(
          <div className="grid-week" key={ri}>
            {row.map((status,ci)=>(
              <div
                key={ci}
                className="grid-cell"
                style={{ background: cellColor(status) }}

};

/* ── MONTH CALENDAR SHEET ── */
const MonthSheet = ({ open, onClose, onSelectDay }) => {
  const daysInMonth = 31, firstWD = 4, todayD = 21;
  const cells = [...Array(firstWD).fill(null)];
  for (let d=1;d<=daysInMonth;d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const getStatus = (d) => {
    if (!d) return null;
    if (d===todayD) return "today";
    if (d>todayD) return "future";
    if (d%6===0) return "missed";
    const wd = (firstWD+(d-1))%7;
    if (wd>=5) return "rest";
    return "done";
  };

  const cellBg = (s) => {
    switch(s) {
      case "done":    return "var(--blue)";
      case "missed":  return "rgba(217,64,64,0.65)";
      case "today":   return "rgba(47,111,237,0.12)";
      case "future":  return "rgba(10,10,15,0.03)";
      default:        return "rgba(10,10,15,0.04)";
    }
  };
  const cellColor = (s) => {
    switch(s) {
      case "done": case "missed": return "#fff";
      case "today": return "var(--blue)";
      default: return "var(--ink3)";
    }
  };

  return (
    <div className={`sheet ${open?"on":""}`}>
      <div className="handle"/>
      <div style={{ padding:"14px 20px 10px", display:"flex", justifyContent:"space-between", alignItems:"flex-end" }}>
        <div>
          <div style={{ fontFamily:"var(--f-sys)", fontSize:12, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:"var(--ink3)", marginBottom:4 }}>
            Calendar
          </div>
          <div style={{ fontFamily:"var(--f-os)", fontSize:32, fontWeight:700, textTransform:"uppercase", color:"var(--ink)", lineHeight:1 }}>
            May 2026
          </div>
        </div>
        <button onClick={onClose} style={{ fontSize:15, fontWeight:500, color:"var(--blue)", background:"none", border:"none", cursor:"pointer" }}>
          Done
        </button>
      </div>

      <div className="scroll notab" style={{ background:"var(--bg)" }}>
        <div style={{ margin:"8px 20px 0" }}>
          <div className="card" style={{ padding:"16px" }}>
            {/* Headers */}
            <div className="grid-week" style={{ marginBottom:8 }}>
              {["M","T","W","T","F","S","S"].map((l,i)=>(
                <div key={i} style={{ textAlign:"center", fontFamily:"var(--f-sys)", fontSize:12, fontWeight:500, color:"var(--ink3)" }}>
                  {l}
                </div>
              ))}
            </div>
            {/* Cells */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:5 }}>
              {cells.map((d,i)=>{
                if (!d) return <div key={i} style={{ height:44 }} />;
                const s = getStatus(d);
                return (
                  <button
                    key={i}
                    className="tap"
                    onClick={() => s!=="future" && onSelectDay(d)}
                    style={{
                      height:44, borderRadius:10, border:"none", cursor:"pointer",
                      background: cellBg(s),
                      display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2,
                      opacity: s==="future" ? 0.4 : 1,
                      boxShadow: s==="today" ? "inset 0 0 0 2px var(--blue)" : "none",
                    }}
                  >
                    <span style={{ fontFamily:"var(--f-os)", fontSize:14, fontWeight: s==="today"?700:500, color: cellColor(s) }}>
                      {d}
                    </span>
                    {s==="done" && <div style={{ width:4, height:4, borderRadius:2, background:"rgba(255,255,255,0.45)" }} />}
                  </button>
                );
              })}
            </div>
          </div>
        </div>

        {/* Legend */}
        <div style={{ display:"flex", flexWrap:"wrap", gap:"10px 20px", padding:"16px 24px" }}>
          {[["var(--blue)","Completed"],["rgba(47,111,237,0.14)","Planned"],["rgba(217,64,64,0.65)","Missed"],["rgba(10,10,15,0.07)","Rest"]].map(([c,l],i)=>(
            <div key={i} style={{ display:"flex", alignItems:"center", gap:6 }}>
              <div style={{ width:10, height:10, borderRadius:3, background:c }} />
              <span style={{ fontSize:12, color:"var(--ink2)" }}>{l}</span>
            </div>
          ))}
        </div>
        <div style={{ height:20 }} />
      </div>
    </div>
  );
};

/* ── SCRUB VALUE — drag left/right to adjust ── */
const ScrubValue = ({ value, field, idx, label, onUpdate, fontSize=26, showUnit }) => {
  const [active, setActive] = useState(false);
  const startX = useRef(0);
  const startVal = useRef(value);
  const step = field === "weight" || field === "restSec" ? 5 : 1;
  const sensitivity = field === "weight" ? 5 : field === "sets" ? 12 : field === "restSec" ? 4 : 8;
  const min = field === "weight" || field === "restSec" ? 0 : 1;

  const begin = (clientX) => {
    startX.current = clientX;
    startVal.current = value;
    setActive(true);
    const move = (e) => {
      const cx = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
      const raw = startVal.current + Math.round((cx - startX.current) / sensitivity) * step;
      onUpdate(idx, field, Math.max(min, raw));
    };
    const end = () => {
      setActive(false);
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup",   end);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend",  end);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup",   end);
    window.addEventListener("touchmove", move, { passive: false });
    window.addEventListener("touchend",  end);
  };

  return (
    <div data-interactive="true" style={{ display:"flex", flexDirection:"column", alignItems:"center", gap: label ? 3 : 0 }}>
      {label && (
        <span style={{ fontSize:9, fontWeight:700, letterSpacing:"0.16em", textTransform:"uppercase", color:"var(--ink3)" }}>{label}</span>
      )}
      <div
        onMouseDown={(e) => { e.stopPropagation(); begin(e.clientX); }}
        onTouchStart={(e) => { e.stopPropagation(); begin(e.touches[0].clientX); }}
        style={{
          fontFamily:"var(--f-os)", fontSize, fontWeight:700, lineHeight:1,
          color: active ? "#2F6FED" : "var(--ink)",
          cursor:"ew-resize", userSelect:"none",
          padding:"4px 7px", borderRadius:7,
          background: active ? "rgba(47,111,237,0.08)" : "transparent",
          borderBottom: active ? "2px solid #2F6FED" : "2px solid transparent",
          transition:"background 0.12s, color 0.12s, border-color 0.12s",
          minWidth:24, textAlign:"center",
        }}
      >
        {value}
        {showUnit && (
          <span style={{ fontSize: Math.max(10, Math.floor(fontSize*0.45)), fontWeight:400, marginLeft:1, color: active ? "#2F6FED" : "var(--ink3)" }}>{showUnit}</span>
        )}
      </div>
    </div>
  );
};

/* ── SWIPE ROW — swipe-left-to-reveal-delete for set rows ── */
const SwipeRow = ({ children, onDelete }) => {
  const [translateX, setTranslateX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startXRef = useRef(0);
  const startTranslateRef = useRef(0);
  const lastTranslateRef = useRef(0);

  const begin = (clientX, target) => {
    if (target && target.closest && target.closest('[data-interactive]')) return;
    startXRef.current = clientX;
    startTranslateRef.current = translateX;
    lastTranslateRef.current = translateX;
    setDragging(true);

    const move = (e) => {
      const cx = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
      const delta = cx - startXRef.current;
      const next = Math.max(-80, Math.min(0, startTranslateRef.current + delta));
      lastTranslateRef.current = next;
      setTranslateX(next);
    };
    const end = () => {
      setDragging(false);
      const snap = lastTranslateRef.current < -36 ? -72 : 0;
      setTranslateX(snap);
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup",   end);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend",  end);
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup",   end);
    window.addEventListener("touchmove", move, { passive: false });
    window.addEventListener("touchend",  end);
  };

  return (
    <div style={{ position:"relative", overflow:"hidden" }}>
      {/* Red panel grows from the right as the user swipes; Delete is centered in whatever is visible */}
      <div style={{
        position:"absolute", top:0, bottom:0, right:0,
        width: Math.max(0, -translateX),
        background:"#D94040",
        display:"flex", alignItems:"center", justifyContent:"center",
        overflow:"hidden",
      }}>
        <button
          onClick={onDelete}
          style={{
            background:"none", border:"none", color:"#fff",
            fontFamily:"var(--f-os)", fontSize:12, fontWeight:600,
            letterSpacing:"0.12em", textTransform:"uppercase",
            cursor:"pointer", padding:0,
          }}
        >
          Delete
        </button>
      </div>
      <div
        onMouseDown={(e) => begin(e.clientX, e.target)}
        onTouchStart={(e) => begin(e.touches[0].clientX, e.target)}
        style={{
          background:"#FFFFFF",
          transform:`translateX(${translateX}px)`,
          transition: dragging ? "none" : "transform 0.26s cubic-bezier(0.32,0.72,0,1)",
          position:"relative",
        }}
      >
        {children}
      </div>
    </div>
  );
};

                  style={{ flex:1, padding:"13px 12px", background:"#FFFFFF", border:"1px solid var(--line)", borderRadius:14, cursor:"pointer", fontFamily:"var(--f-os)", fontSize:12, fontWeight:700, color:"var(--ink)", textTransform:"uppercase", letterSpacing:"0.06em" }}>
                  Make Superset
                </button>
                <button onClick={startMakeCircuit}
                  style={{ flex:1, padding:"13px 12px", background:"#FFFFFF", border:"1px solid var(--line)", borderRadius:14, cursor:"pointer", fontFamily:"var(--f-os)", fontSize:12, fontWeight:700, color:"var(--ink)", textTransform:"uppercase", letterSpacing:"0.06em" }}>
                  Make Circuit
                </button>
              </div>
            </div>

            <div style={{ height:24 }}/>
          </div>
        )}
      </div>

      <TechniqueMenu
        open={techMenuOpen}
        currentId={currentTechId}
        onPick={handleTechPick}
        onClose={() => setTechMenuOpen(false)}
      />

      <GlossarySheet open={showGlossary} onClose={() => setShowGlossary(false)}/>
    </>
  );
};

/* ── GROUP EDITOR — multi-exercise group editor ── */
const GroupEditor = ({ open, primaryId, items, openCatalog, workoutName, updateItem, updateSetField, addSet, deleteSet, setItemTechnique, addMembersFromCatalog, removeMember, dissolveGroup, onClose }) => {

    <>
      <div onClick={onClose} style={{ position:"absolute", inset:0, background:"rgba(0,0,0,0.5)", zIndex:25, opacity: open?1:0, pointerEvents: open?"auto":"none", transition:"opacity 0.28s" }}/>
      <div style={{

        transition:"transform 0.36s cubic-bezier(0.32,0.72,0,1)",

        <div style={{ width:36, height:5, background:"var(--ink4)", borderRadius:3, margin:"8px auto 0" }}/>

        <div style={{ padding:"14px 20px 14px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer", padding:4 }}>
            <Icon name="X" size={20} color="var(--ink)" sw={2}/>
          </button>
          <div style={{ fontFamily:"var(--f-os)", fontSize:20, fontWeight:700, textTransform:"uppercase", color:"var(--ink)", letterSpacing:"0.04em", textAlign:"center", flex:1 }}>
            {groupKind === "superset" ? "Superset" : groupKind === "circuit" ? "Circuit" : ""}
          </div>
          <button onClick={onClose} style={{ background:"none", border:"none", cursor:"pointer",
            fontFamily:"var(--f-os)", fontSize:13, fontWeight:600, letterSpacing:"0.1em",
            textTransform:"uppercase", color:"var(--blue)" }}>

        {primary && groupKind && members.length > 0 && (

              {members.length} exercises · back-to-back
            </div>

            {members.map((memIt, slotIdx) => {

              const memTechId = memIt.techId ?? "normal";
              return (
                <div key={memIt.id} style={{ marginBottom:18 }}>
                  <div style={{ display:"flex", alignItems:"center", marginBottom:8, justifyContent:"space-between" }}>
                    <div style={{ display:"flex", alignItems:"baseline", gap:8 }}>

                      <span style={{ fontFamily:"var(--f-os)", fontSize:15, fontWeight:500, color:"var(--ink)", textTransform:"uppercase", letterSpacing:"0.04em" }}>{memIt.ex.name}</span>
                    </div>
                    <button onClick={() => removeMember(memIt.id)}
                      style={{ background:"none", border:"none", cursor:"pointer", padding:6, color:"var(--ink3)" }}>
                      <Icon name="X" size={15} color="var(--ink3)" sw={2}/>
                    </button>
                  </div>
                  <button
                    onClick={() => setTechMenuForItem(memIt.id)}

                    <span>Technique · {techById(memTechId).label}</span>

              style={{

      <TechniqueMenu

/* ── WORKOUT DETAIL PUSH ── */
const WorkoutDetail = ({ open, workout, onClose, onStart, customNames = {}, setCustomNames, customItems = {}, setCustomItems }) => {
  const [items, setItems] = useState([]);
  const idCounter = useRef(0);

  // Workout name (editable) — initialized from customNames if present
  const [workoutName, setWorkoutName] = useState("");
  const [editingName, setEditingName] = useState(false);

  // Catalog state: { open, mode, title, excludeNames, onPick, onConfirm }
  const [catalogState, setCatalogState] = useState({ open: false });

  const [advancedFor, setAdvancedFor] = useState(null);
  const [groupEditorFor, setGroupEditorFor] = useState(null);

  // Drag-reorder state
  const [draggingIdx, setDraggingIdx] = useState(null);
  const [dragOffsetY, setDragOffsetY] = useState(0);
  const [targetIdx, setTargetIdx] = useState(null);
  const targetIdxRef = useRef(null);

  // Swipe state
  const [activeSwipeIdx, setActiveSwipeIdx] = useState(null);
  const [activeSwipeX, setActiveSwipeX] = useState(0);
  const [revealedIdx, setRevealedIdx] = useState(null);

  // Delete poof state
  const [deletingKey, setDeletingKey] = useState(null);

  const CARD_HEIGHT = 92;

  useEffect(() => {
    if (workout) {
      idCounter.current = 0;
      const key = workout.name;
      // Use the persisted (edited) item list if we have one, else build from defaults
      const saved = customItems[key];
      if (saved && Array.isArray(saved) && saved.length > 0) {
        // Re-key ids defensively to avoid duplicate-id collisions across reopens
        const maxIdSeen = saved.reduce((m, it) => {
          const n = parseInt(String(it.id || "").replace(/^it-/, ""), 10);
          return Number.isFinite(n) ? Math.max(m, n) : m;
        }, 0);
        idCounter.current = maxIdSeen;
        setItems(saved);
      } else {
        setItems(workout.exercises.map((b) => ({
          id: `it-${++idCounter.current}`,
          ex: b.ex,
          sets: b.sets,
          reps: b.reps ?? null,
          weight: b.weight ?? null,
          restSec: 90,
          durSec: b.durSec ?? null,
          setDetails: null,
          pairedWithIds: [],
          pairType: null,
        })));
      }
      setWorkoutName(customNames[key] || workout.name);
      setEditingName(false);
      setCatalogState({ open: false });
      setAdvancedFor(null); setGroupEditorFor(null);
      setDraggingIdx(null); setActiveSwipeIdx(null); setRevealedIdx(null); setDeletingKey(null);
    }
  }, [workout]);

  // Sync edits back to App state so Today / other screens reflect them immediately.
  // Skipped on the very first render of a fresh workout (the init effect above
  // already wrote-through to local state, no need to bounce it back).
  const itemsSyncSkipRef = useRef(true);
  useEffect(() => {
    if (!workout) return;
    if (itemsSyncSkipRef.current) { itemsSyncSkipRef.current = false; return; }
    if (typeof setCustomItems === "function") {
      setCustomItems(prev => ({ ...prev, [workout.name]: items }));
    }
  }, [items]);
  // Reset the skip flag whenever the workout itself changes
  useEffect(() => { itemsSyncSkipRef.current = true; }, [workout]);

  if (!workout) return <div className={`push ${open?"on":""}`}/>;

  /* Catalog control */
  const openCatalog = (opts) => setCatalogState({ open: true, ...opts });
  const closeCatalog = () => setCatalogState({ open: false });

  /* Item handlers */
  const updateItem = (id, field, val) => {
    setItems(prev => prev.map(it => it.id === id ? { ...it, [field]: val } : it));
  };

  const updateSetField = (id, setIdx, field, val) => {
    setItems(prev => prev.map(it => {
      if (it.id !== id) return it;
      const details = (it.setDetails ?? Array.from({ length: it.sets }, () => ({ reps: it.reps, techId: "normal" }))).map(d => ({ ...d }));
      if (!details[setIdx]) details[setIdx] = { reps: it.reps, techId: "normal" };
      details[setIdx][field] = val;
      return { ...it, setDetails: details };
    }));
  };

  const addSet = (id) => {
    setItems(prev => prev.map(it => {
      if (it.id !== id) return it;
      const newSets = it.sets + 1;
      const details = it.setDetails ? [...it.setDetails, { reps: it.reps, techId: "normal" }] : null;
      return { ...it, sets: newSets, setDetails: details };
    }));
  };

  const deleteSet = (id, setIdx) => {
    setItems(prev => prev.map(it => {
      if (it.id !== id || it.sets <= 1) return it;
      const details = (it.setDetails ?? Array.from({ length: it.sets }, () => ({ reps: it.reps, techId: "normal" })));
      const newDetails = [...details.slice(0, setIdx), ...details.slice(setIdx + 1)];
      return { ...it, sets: it.sets - 1, setDetails: newDetails };
    }));
  };

  const setSetTechnique = (id, setIdx, techId) => {
    setItems(prev => prev.map(it => {
      if (it.id !== id) return it;
      const details = (it.setDetails ?? Array.from({ length: it.sets }, () => ({ reps: it.reps, techId: "normal" }))).map(d => ({ ...d }));
      if (!details[setIdx]) details[setIdx] = { reps: it.reps, techId: "normal" };
      details[setIdx].techId = techId;
      return { ...it, setDetails: details };
    }));
  };

  // Per-EXERCISE technique — applies to all sets of that exercise.
  const setItemTechnique = (id, techId) => {
    setItems(prev => prev.map(it => it.id === id ? { ...it, techId } : it));
  };

  /* Group handlers */
  // selectedCatalogEntries: array of CATALOG entries (with { id, name, tab, equipment, type, group })
  const createPairFromCatalog = (primaryId, selectedCatalogEntries, mode) => {
    if (!primaryId || !selectedCatalogEntries || selectedCatalogEntries.length === 0) return;
    // For each selection: find existing item with same name, else create new
    const allPairedIds = [];
    const newItems = [];
    for (const ce of selectedCatalogEntries) {
      const existing = items.find(it => it.ex.name === ce.name && it.id !== primaryId);
      if (existing) {
        allPairedIds.push(existing.id);
      } else {
        const newId = `it-${++idCounter.current}`;
        const ex = catalogToEx(ce);
        newItems.push({
          id: newId, ex,
          sets: 3, reps: ex.type === 'timed' ? null : 10,
          restSec: 90, durSec: ex.type === 'timed' ? 30 : null,
          setDetails: null, pairedWithIds: [], pairType: null,
        });
        allPairedIds.push(newId);
      }
    }
    const allGroupIds = [primaryId, ...allPairedIds];
    setItems(prev => {
      const withNew = [...prev, ...newItems];
      return withNew.map(it => allGroupIds.includes(it.id)
        ? { ...it, pairType: mode, pairedWithIds: allGroupIds.filter(x => x !== it.id) }
        : it
      );
    });
    setAdvancedFor(null);
    setTimeout(() => setGroupEditorFor(primaryId), 360);
  };

  const addMembersFromCatalog = (anyMemberId, selectedCatalogEntries) => {
    const member = items.find(it => it.id === anyMemberId);
    if (!member?.pairType) return;
    const currentMembers = [anyMemberId, ...member.pairedWithIds];
    const addedIds = [];
    const newItems = [];
    for (const ce of selectedCatalogEntries) {
      const existing = items.find(it => it.ex.name === ce.name && !currentMembers.includes(it.id));
      if (existing) {
        addedIds.push(existing.id);
      } else {
        const newId = `it-${++idCounter.current}`;
        const ex = catalogToEx(ce);
        newItems.push({
          id: newId, ex,
          sets: 3, reps: ex.type === 'timed' ? null : 10,
          restSec: 90, durSec: ex.type === 'timed' ? 30 : null,
          setDetails: null, pairedWithIds: [], pairType: null,
        });
        addedIds.push(newId);
      }
    }
    const allMembers = [...currentMembers, ...addedIds];
    setItems(prev => {
      const withNew = [...prev, ...newItems];
      return withNew.map(it => allMembers.includes(it.id)
        ? { ...it, pairType: member.pairType, pairedWithIds: allMembers.filter(x => x !== it.id) }
        : it
      );
    });
  };

  /* Add a single exercise to the workout from catalog */
  const addExerciseFromCatalog = (ce) => {
    const ex = catalogToEx(ce);
    setItems(prev => [...prev, {
      id: `it-${++idCounter.current}`, ex,
      sets: 3, reps: ex.type === 'timed' ? null : 10,
      restSec: 90, durSec: ex.type === 'timed' ? 30 : null,
      setDetails: null, pairedWithIds: [], pairType: null,
    }]);
  };

  /* Swap one item with a catalog exercise */
  const swapItem = (itemId, ce) => {
    const ex = catalogToEx(ce);
    setItems(prev => prev.map(it => it.id === itemId
      ? { ...it, ex,
          // Reset timed/rep fields based on new type
          reps: ex.type === 'timed' ? null : (it.reps ?? 10),
          durSec: ex.type === 'timed' ? (it.durSec ?? 30) : null,
        }
      : it));
  };

  const removeMember = (id) => {
    const item = items.find(it => it.id === id);
    if (!item?.pairType) return;
    const remainingIds = item.pairedWithIds;
    setItems(prev => prev.map(it => {
      if (it.id === id) {
        return { ...it, pairType: null, pairedWithIds: [] };
      }
      if (item.pairedWithIds.includes(it.id)) {
        const newPairs = remainingIds.filter(x => x !== it.id);
        if (newPairs.length === 0) {
          return { ...it, pairType: null, pairedWithIds: [] };
        }
        return { ...it, pairedWithIds: newPairs };
      }
      return it;
    }));
  };

  const dissolveGroup = (anyMemberId) => {
    const item = items.find(it => it.id === anyMemberId);
    if (!item?.pairType) return;
    const memberSet = new Set([anyMemberId, ...item.pairedWithIds]);
    setItems(prev => prev.map(it => memberSet.has(it.id) ? { ...it, pairType: null, pairedWithIds: [] } : it));
  };

  /* Exercise add/delete */
  const deleteItem = (id) => {
    const item = items.find(it => it.id === id);
    if (!item) return;
    setItems(prev => {
      const partnerIds = item.pairedWithIds || [];
      const updated = prev.map(it => {
        if (partnerIds.includes(it.id)) {
          const newPairs = it.pairedWithIds.filter(p => p !== id);
          if (newPairs.length === 0) {
            return { ...it, pairType: null, pairedWithIds: [] };
          }
          return { ...it, pairedWithIds: newPairs };
        }
        return it;
      });
      return updated.filter(it => it.id !== id);
    });
  };

  const deleteGroup = (anyMemberId) => {
    const item = items.find(it => it.id === anyMemberId);
    if (!item?.pairType) return;
    const memberSet = new Set([anyMemberId, ...item.pairedWithIds]);
    setItems(prev => prev.filter(it => !memberSet.has(it.id)));
  };

  /* Compute renderItems */
  const computeRenderItems = (sourceItems) => {
    const result = [];
    const seen = new Set();
    sourceItems.forEach((it) => {
      if (seen.has(it.id)) return;
      if (it.pairType) {
        const groupIds = [it.id, ...it.pairedWithIds];
        const groupMembers = groupIds
          .map(id => sourceItems.find(x => x.id === id))
          .filter(Boolean)
          .sort((a, b) => sourceItems.indexOf(a) - sourceItems.indexOf(b));
        groupIds.forEach(g => seen.add(g));
        result.push({ key: groupIds.join('-'), type: 'group', items: groupMembers, kind: it.pairType, primaryId: it.id, firstItemId: groupMembers[0]?.id });
      } else {
        result.push({ key: it.id, type: 'exercise', item: it, firstItemId: it.id });
        seen.add(it.id);
      }
    });
    return result;
  };

  const renderItems = computeRenderItems(items);

  const reorderRenderItems = (fromRenderIdx, toRenderIdx) => {
    if (fromRenderIdx === toRenderIdx) return;
    setItems(prev => {
      const currentRender = computeRenderItems(prev);
      if (fromRenderIdx >= currentRender.length || toRenderIdx >= currentRender.length) return prev;
      const movingRender = currentRender[fromRenderIdx];
      const movingIds = new Set(
        movingRender.type === 'group'
          ? movingRender.items.map(x => x.id)
          : [movingRender.item.id]
      );
      const movingItems = prev.filter(it => movingIds.has(it.id));
      const remaining = prev.filter(it => !movingIds.has(it.id));
      const remainingRender = computeRenderItems(remaining);
      let adjustedTarget = toRenderIdx;
      if (toRenderIdx > fromRenderIdx) adjustedTarget = toRenderIdx - 1;
      let insertBeforeId = null;
      if (adjustedTarget >= 0 && adjustedTarget < remainingRender.length) {
        insertBeforeId = remainingRender[adjustedTarget].firstItemId;
      }
      let insertIdx;
      if (insertBeforeId === null) {
        insertIdx = remaining.length;
      } else {
        insertIdx = remaining.findIndex(it => it.id === insertBeforeId);
        if (insertIdx === -1) insertIdx = remaining.length;
      }
      return [
        ...remaining.slice(0, insertIdx),
        ...movingItems,
        ...remaining.slice(insertIdx),
      ];
    });
  };

  /* Combined card gesture (tap / swipe / long-press-drag) */
  const beginCardInteraction = (e, renderIdx, onTap) => {
    const target = e.target;
    if (target.closest && (target.closest('[data-interactive]') || target.closest('[data-no-drag]'))) return;

    const startY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
    const startX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
    let mode = 'pending';
    let lastDx = 0;

    if (revealedIdx !== null && revealedIdx !== renderIdx) {
      setRevealedIdx(null);
    }

    const longPressTimer = setTimeout(() => {
      if (mode === 'pending') {
        mode = 'drag';
        setDraggingIdx(renderIdx);
        setDragOffsetY(0);
        targetIdxRef.current = renderIdx;
        setTargetIdx(renderIdx);
      }
    }, 350);

    const onMove = (me) => {
      const y = me.clientY ?? me.touches?.[0]?.clientY ?? 0;
      const x = me.clientX ?? me.touches?.[0]?.clientX ?? 0;
      const dx = x - startX;
      const dy = y - startY;
      lastDx = dx;

      if (mode === 'pending') {
        if (Math.abs(dx) > 6 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          mode = 'swipe';
          clearTimeout(longPressTimer);
          setActiveSwipeIdx(renderIdx);
          setActiveSwipeX(Math.max(-90, Math.min(0, dx)));
        } else if (Math.abs(dy) > 6) {
          mode = 'cancelled';
          clearTimeout(longPressTimer);
        }
      } else if (mode === 'swipe') {
        setActiveSwipeX(Math.max(-90, Math.min(0, dx)));
      } else if (mode === 'drag') {
        const offset = y - startY;
        setDragOffsetY(offset);
        const slots = Math.round(offset / CARD_HEIGHT);
        const newTarget = Math.max(0, Math.min(renderItems.length - 1, renderIdx + slots));
        targetIdxRef.current = newTarget;
        setTargetIdx(newTarget);
      }
    };

    const onEnd = () => {
      clearTimeout(longPressTimer);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onEnd);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('touchend', onEnd);

      if (mode === 'pending') {
        if (revealedIdx === renderIdx) {
          setRevealedIdx(null);
        } else {
          onTap();
        }
      } else if (mode === 'swipe') {
        if (lastDx < -45) {
          setRevealedIdx(renderIdx);
        } else {
          setRevealedIdx(null);
        }
        setActiveSwipeIdx(null);
        setActiveSwipeX(0);
      } else if (mode === 'drag') {
        const finalTarget = targetIdxRef.current ?? renderIdx;
        if (finalTarget !== renderIdx) {
          reorderRenderItems(renderIdx, finalTarget);
        }
        setDraggingIdx(null);
        setDragOffsetY(0);
        setTargetIdx(null);
        targetIdxRef.current = null;
      }
    };

    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd);
  };

  const onCardTap = (rit) => {
    if (rit.type === 'group') {
      setGroupEditorFor(rit.primaryId);
    } else {
      openCatalog({
        mode: "single",
        title: `Swap ${rit.item.ex.name}`,
        excludeNames: items.filter(it => it.id !== rit.item.id).map(it => it.ex.name),
        onPick: (ce) => { swapItem(rit.item.id, ce); },
      });
    }
  };

  const onCardDelete = (renderIdx) => {
    const rit = renderItems[renderIdx];
    if (!rit) return;
    setDeletingKey(rit.key);
    setRevealedIdx(null);
    setTimeout(() => {
      if (rit.type === 'group') deleteGroup(rit.primaryId);
      else deleteItem(rit.item.id);
      setDeletingKey(null);
    }, 260);
  };

  return (
    <div className={`push ${open?"on":""}`} style={{ background:"#E5E6E9" }}>

      <svg style={{ position:"absolute", inset:0, width:"100%", height:"100%", zIndex:0, pointerEvents:"none" }}
           viewBox="0 0 393 852" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs>
          <filter id="pc2" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1.5" dy="4" stdDeviation="5.5" flood-color="#8C8E96" flood-opacity="0.17"/>
          </filter>
          <filter id="pcs2" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="1" dy="2.5" stdDeviation="4" flood-color="#8C8E96" flood-opacity="0.13"/>
          </filter>
        </defs>
        <path d="M 403 -10 L 403 310 C 380 294 350 318 322 298 C 294 278 298 232 272 206 C 246 180 215 196 198 169 C 181 142 196 96 222 66 C 248 36 335 -10 403 -10 Z" fill="#F0F0F3" filter="url(#pc2)"/>
        <path d="M -10 175 L -10 435 C 26 415 68 442 92 414 C 116 386 104 340 130 316 C 156 292 182 306 192 280 C 202 254 184 218 165 200 C 146 182 72 172 -10 175 Z" fill="#EDEEF2" filter="url(#pc2)"/>
        <path d="M 403 390 L 403 648 C 380 632 353 656 326 642 C 299 628 292 592 272 572 C 252 552 228 562 215 536 C 202 510 216 478 238 462 C 260 446 286 456 307 440 C 328 424 336 392 360 379 C 378 370 403 378 403 378 Z" fill="#F2F2F5" filter="url(#pc2)"/>
        <path d="M -10 512 L -10 862 L 272 862 L 272 826 C 236 806 200 830 163 817 C 126 804 100 766 62 770 C 38 772 8 786 -10 776 Z" fill="#EDEEF2" filter="url(#pc2)"/>
        <path d="M 306 862 L 403 862 L 403 688 C 390 676 370 692 352 682 C 334 672 324 649 305 656 C 291 661 285 682 288 740 Z" fill="#F0F0F3" filter="url(#pc2)"/>
        <path d="M -10 -10 L 95 -10 C 106 18 92 62 70 87 C 48 112 18 100 -2 144 C -8 158 -10 163 -10 152 Z" fill="#F4F4F7" filter="url(#pcs2)"/>
        <path d="M 240 300 C 272 272 320 282 338 316 C 356 350 340 394 306 402 C 272 410 228 386 222 350 C 216 318 222 314 240 300 Z" fill="#F4F4F7" filter="url(#pcs2)"/>
        <path d="M 140 560 C 158 538 188 543 196 566 C 204 589 188 612 164 607 C 140 602 124 582 140 560 Z" fill="#F8F8FA" filter="url(#pcs2)"/>
      </svg>

      <SBar/>
      <div style={{ position:"absolute", top:54, left:0, right:0, bottom:0, zIndex:1 }}>

        <div style={{ padding:"10px 20px 0" }}>
          <button onClick={onClose} className="tap" style={{ display:"flex", alignItems:"center", gap:3, background:"none", border:"none", cursor:"pointer" }}>
            <Icon name="ChevronLeft" size={18} color="var(--ink)" sw={2.2}/>
            <span style={{ fontSize:14, color:"var(--ink)", fontWeight:500 }}>Today</span>
          </button>
        </div>

        <div className="scroll notab">

          <div style={{ textAlign:"center", padding:"8px 24px 0" }}>
            {editingName ? (
              <input
                value={workoutName}
                onChange={(e) => setWorkoutName(e.target.value)}
                onBlur={() => {
                  const finalName = workoutName.trim() || workout.name;
                  setWorkoutName(finalName);
                  setEditingName(false);
                  if (typeof setCustomNames === "function") {
                    setCustomNames(prev => {
                      const key = workout.name;
                      if (finalName === workout.name) {
                        // Reset to default — drop the custom entry

                        return rest;
                      }
                      return { ...prev, [key]: finalName };

                }}
                onKeyDown={(e) => {

              const isDragging = draggingIdx === idx;

              if (!isDragging && draggingIdx !== null && targetIdx !== null) {
                const origIdx = draggingIdx, target = targetIdx;
                if (target > origIdx && idx > origIdx && idx <= target) displaceY = -CARD_HEIGHT;
                else if (target < origIdx && idx >= target && idx < origIdx) displaceY = CARD_HEIGHT;
              }

              // X-only swipe offset for delete reveal
              let swipeX = 0;
              if (activeSwipeIdx === idx) swipeX = activeSwipeX;
              else if (revealedIdx === idx) swipeX = -75;

              const isStandalone = rit.type === 'exercise';

              return (
                // OUTER WRAPPER — all Y movement lives here (drag + displacement) + poof

                    transition: (isDragging || activeSwipeIdx === idx) ? "none" : "transform 0.24s cubic-bezier(0.32,0.72,0,1)",
                    zIndex: isDragging ? 50 : 1,

                    position:"absolute", top:0, bottom:0, right:0,
                    width: Math.max(0, -swipeX),
                    borderTopRightRadius:18, borderBottomRightRadius:18,

                    <button
                      data-interactive="true"
                      onClick={() => onCardDelete(idx)}
                      style={{ color:"#fff", fontFamily:"var(--f-os)", fontSize:12, fontWeight:600, letterSpacing:"0.14em", textTransform:"uppercase", background:"none", border:"none", cursor:"pointer", padding:0 }}

                      Delete

                  </div>

                  {/* INNER CARD — X-only movement (swipe to reveal) */}
                  <div
                    onMouseDown={(e) => beginCardInteraction(e, idx, () => onCardTap(rit))}
                    onTouchStart={(e) => beginCardInteraction(e, idx, () => onCardTap(rit))}
                    style={{
                      transform: `translateX(${swipeX}px)`,
                      transition: activeSwipeIdx === idx ? "none" : "transform 0.24s cubic-bezier(0.32,0.72,0,1)",
                      borderRadius:18,
                      touchAction:"pan-y",
                    }}
                  >
                    {isStandalone ? (
                      <div style={{
                        background:"var(--white)", borderRadius:18,
                        border:"2px solid var(--ink)",
                        boxShadow:"0 3px 14px rgba(10,10,15,0.08)",
                        cursor:"pointer", overflow:"hidden",
                      }}>
                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"11px 14px 0" }}>
                          <div style={{ fontFamily:"var(--f-os)", fontSize:16, fontWeight:500, textTransform:"uppercase", color:"var(--ink)", letterSpacing:"0.04em" }}>
                            {rit.item.ex.name}
