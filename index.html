                        </div>

                        <div style={{ height:1, background:"var(--line)", margin:"9px 14px 0" }} />

                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"5px 14px 7px 12px" }}>
                          <div style={{ display:"flex", alignItems:"center", gap:0 }}>
                            <ScrubValue value={rit.item.sets} field="sets" idx={rit.item.id} onUpdate={updateItem} fontSize={19}/>
                            <span style={{ fontSize:12, color:"var(--ink3)", padding:"0 2px" }}>×</span>
                            {(rit.item.ex.type === "timed" || !!rit.item.durSec)
                              ? <ScrubValue value={rit.item.durSec||0} field="durSec" idx={rit.item.id} onUpdate={updateItem} fontSize={19} showUnit="s"/>
                              : <ScrubValue value={rit.item.reps||0} field="reps" idx={rit.item.id} onUpdate={updateItem} fontSize={19}/>
                            }
                            <span style={{ fontSize:12, color:"var(--ink3)", padding:"0 6px" }}>·</span>
                            <ScrubValue value={rit.item.restSec ?? 90} field="restSec" idx={rit.item.id} onUpdate={updateItem} fontSize={14} showUnit="s"/>
                            <span style={{ fontSize:10, color:"var(--ink3)", marginLeft:2 }}>rest</span>
                          </div>
                          <button
                            data-interactive="true"
                            onClick={(ev) => { ev.stopPropagation(); setAdvancedFor(rit.item.id); }}
                            style={{
                              background:"none", border:"none", cursor:"pointer", padding:"4px 0",
                              display:"flex", alignItems:"center",
                            }}
                            aria-label="Advanced">
                            <Icon name="ChevronRight" size={15} color="var(--ink)" sw={2.6}/>
                            <span style={{ display:"inline-flex", marginLeft:-7 }}>
                              <Icon name="ChevronRight" size={15} color="var(--ink)" sw={2.6}/>
                            </span>
                            <span style={{ display:"inline-flex", marginLeft:-7 }}>
                              <Icon name="ChevronRight" size={15} color="var(--ink)" sw={2.6}/>
                            </span>
                          </button>
                        </div>
                      </div>
                    ) : (
                      // GROUP CARD — left blue bar is the only blue; labels use ink/ink2
                      <div style={{
                        background:"var(--white)", borderRadius:18,
                        border:"2px solid var(--ink)",
                        boxShadow:"0 3px 14px rgba(10,10,15,0.08)",
                        cursor:"pointer", overflow:"hidden",
                        position:"relative",
                      }}>
                        <div style={{ position:"absolute", left:0, top:0, bottom:0, width:4, background:"var(--blue)" }}/>

                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 14px 0 18px" }}>
                          <div style={{ fontFamily:"var(--f-os)", fontSize:11, fontWeight:700, textTransform:"uppercase", color:"var(--ink2)", letterSpacing:"0.2em" }}>
                            {rit.kind === "superset" ? "Superset" : "Circuit"}
                          </div>
                          <div style={{ fontSize:10, color:"var(--ink3)" }}>{rit.items.length} exercises</div>
                        </div>

                        <div style={{ height:1, background:"var(--line)", margin:"8px 14px 0 18px" }} />

                        <div style={{ padding:"6px 14px 4px 18px" }}>
                          {rit.items.map((memIt, slotIdx) => {
                            const letter = String.fromCharCode(65 + slotIdx);
                            const isTimed = memIt.ex.type === "timed" || !!memIt.durSec;
                            const repsOrTime = isTimed ? `${memIt.durSec||0}s` : (memIt.reps||0);
                            return (
                              <div key={memIt.id} style={{ display:"flex", alignItems:"center", padding:"5px 0" }}>
                                <span style={{ fontFamily:"var(--f-os)", fontSize:11, fontWeight:700, color:"var(--ink3)", width:18 }}>{letter}</span>
                                <span style={{ fontFamily:"var(--f-os)", fontSize:14, fontWeight:700, textTransform:"uppercase", color:"var(--ink)", letterSpacing:"0.03em", flex:1 }}>
                                  {memIt.ex.name}
                                </span>
                                <span style={{ fontFamily:"var(--f-os)", fontSize:13, fontWeight:600, color:"var(--ink2)" }}>
                                  {memIt.sets} × {repsOrTime}
                                </span>
                              </div>
                            );
                          })}
                        </div>

                        <div style={{ height:1, background:"var(--line)", margin:"4px 14px 0 18px" }} />

                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"7px 14px 8px 18px" }}>
                          <span style={{ fontSize:11, color:"var(--ink3)" }}>
                            {items.find(it => it.id === rit.primaryId)?.restSec ?? 90}s between rounds
                          </span>
                          <span style={{ fontSize:12, fontWeight:500, color:"var(--ink2)", display:"flex", alignItems:"center", gap:2 }}>
                            Edit
                            <Icon name="ChevronRight" size={12} color="var(--ink2)" sw={2.2}/>
                          </span>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}

            {/* Add Exercise */}
            <button
              onClick={() => openCatalog({
                mode: "multi",
                title: "Add Exercises",
                excludeNames: items.map(it => it.ex.name),
                onConfirm: (selectedCatalogEntries) => {
                  selectedCatalogEntries.forEach(ce => addExerciseFromCatalog(ce));
                },
              })}
              style={{
                width:"100%", marginTop:14, padding:"16px",
                background:"transparent", border:"2px dashed var(--ink3)", borderRadius:18,
                cursor:"pointer", color:"var(--ink)",
                fontFamily:"var(--f-os)", fontSize:13, fontWeight:700,
                letterSpacing:"0.14em", textTransform:"uppercase",
                display:"flex", alignItems:"center", justifyContent:"center", gap:6,
              }}>
              <Icon name="Plus" size={15} color="var(--ink)" sw={2.2}/>
              Add Exercise
            </button>
          </div>

          <div style={{ height:48 }} />
        </div>

        <AdvancedSheet
          open={advancedFor !== null}
          itemId={advancedFor}
          items={items}
          openCatalog={openCatalog}
          workoutName={workoutName}
          updateItem={updateItem}
          updateSetField={updateSetField}
          addSet={addSet}
          deleteSet={deleteSet}
          setItemTechnique={setItemTechnique}
          onCreatePair={createPairFromCatalog}
          onClose={() => setAdvancedFor(null)}
        />

        <GroupEditor
          open={groupEditorFor !== null}
          primaryId={groupEditorFor}
          items={items}
          openCatalog={openCatalog}
          workoutName={workoutName}
          updateItem={updateItem}
          updateSetField={updateSetField}
          addSet={addSet}
          deleteSet={deleteSet}
          setItemTechnique={setItemTechnique}
          addMembersFromCatalog={addMembersFromCatalog}
          removeMember={removeMember}
          dissolveGroup={dissolveGroup}
          onClose={() => setGroupEditorFor(null)}
        />

      </div>

      {/* Catalog must live OUTSIDE the top:54 inner container so it fully
          covers the WorkoutDetail SBar — otherwise we double-stack status bars */}
      <CatalogScreen
        open={catalogState.open}
        mode={catalogState.mode}
        title={catalogState.title}
        excludeNames={catalogState.excludeNames || []}
        workoutName={workoutName}
        onPick={catalogState.onPick}
        onConfirm={catalogState.onConfirm}
        onClose={closeCatalog}
      />
    </div>
  );
};



/* ── ACTIVE WORKOUT ── */
const ExerciseIcon = ({ block, done }) => {
  const type = block.ex.type;
  if (done) {
    return (
      <div className="ex-icon done" style={{ background:"#fff" }}>
        <Icon name="Check" size={20} color="var(--d-bg)" sw={3}/>
      </div>
    );
  }
  if (type==="timed") {
    return (
      <div className="ex-icon timed">
        <Icon name="Clock" size={20} color="rgba(255,255,255,0.6)" sw={1.8}/>
      </div>
    );
  }
  if (!block.reps && block.sets > 1) {
    return (
      <div className="ex-icon active">
        <Icon name="RefreshCw" size={18} color="rgba(255,255,255,0.6)" sw={2}/>
      </div>
    );
  }
  return (
    <div className="ex-icon pending" style={{ borderRadius:10, width:44, height:44, border:"2px solid rgba(255,255,255,0.15)" }}>
    </div>
  );
};

const ActiveWorkout = ({ open, workout, onClose, customNames = {}, customItems = {} }) => {
  const [done, setDone] = useState({});
  const [sec, setSec]   = useState(0);

  useEffect(() => {
    if (!open) { setDone({}); setSec(0); return; }
    const id = setInterval(() => setSec(s=>s+1), 1000);
    return () => clearInterval(id);
  }, [open]);

  const fmt = (s) => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  const w = workout || LEGS;
  // Use live customItems if available; otherwise fall back to static exercises.
  const rawExs = customItems[w.name] || w.exercises;
  // Normalize: both formats have .ex.name; customItems items have .sets, .reps, etc.
  const exs = rawExs.map(e => ({ ex: e.ex, sets: e.sets || 3, reps: e.reps || null, durSec: e.durSec || null }));
  const displayName = customNames[w.name] || w.name;
  const doneCount = Object.values(done).filter(Boolean).length;
  const nextIdx = exs.findIndex((_,i)=>!done[i]);

  return (
    <div className={`fsmodal ${open?"on":""}`}>
      <SBar dark/>
      <div style={{ position:"absolute", top:54, left:0, right:0, bottom:0 }}>

        {/* Top bar */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"12px 24px 0" }}>
          <button onClick={onClose} className="tap" style={{ background:"none", border:"none", cursor:"pointer" }}>
            <Icon name="ChevronDown" size={24} color="#fff" sw={2}/>
          </button>
          <span style={{ fontFamily:"var(--f-sys)", fontSize:12, color:"rgba(255,255,255,0.35)", letterSpacing:"0.04em" }}>
            {doneCount} / {exs.length}
          </span>
          <button
            onClick={onClose}
            className="tap"
            style={{ padding:"9px 20px", borderRadius:30, background:"var(--d-surf)", border:"1px solid rgba(255,255,255,0.1)", color:"#fff", fontFamily:"var(--f-sys)", fontSize:15, fontWeight:600, cursor:"pointer" }}
          >
            Finish
          </button>
        </div>

        {/* Timer + name */}
        <div style={{ padding:"28px 24px 0" }}>
          <div style={{ fontFamily:"var(--f-os)", fontSize:76, fontWeight:300, lineHeight:1, color:"#fff", fontVariantNumeric:"tabular-nums", letterSpacing:"-0.01em" }}>
            {fmt(sec)}
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:8 }}>
            <span style={{ fontFamily:"var(--f-os)", fontSize:17, fontWeight:700, textTransform:"uppercase", color:"#fff", letterSpacing:"0.04em" }}>{displayName}</span>
            <span style={{ fontSize:15, color:"rgba(255,255,255,0.35)" }}>· In progress</span>
          </div>
        </div>

        <div style={{ height:20 }} />

        {/* Exercise list */}
        <div style={{ overflowY:"auto", maxHeight:"calc(100% - 285px)" }}>
          {exs.map((b,i)=>{
            const isDone = !!done[i];
            return (
              <div key={i}>
                <button
                  className="tap"
                  style={{ display:"flex", alignItems:"center", gap:16, padding:"14px 24px", width:"100%", textAlign:"left", background:"none", border:"none", cursor:"pointer" }}
                  onClick={()=>setDone({...done,[i]:!isDone})}
                >
                  <ExerciseIcon block={b} done={isDone}/>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:17, fontWeight:600, color: isDone?"rgba(255,255,255,0.3)":"#fff", transition:"color 0.2s ease" }}>
                      {b.ex.name}
                    </div>
                    <div style={{ fontSize:13, marginTop:2, color: isDone?"rgba(255,255,255,0.18)":"rgba(255,255,255,0.45)", transition:"color 0.2s ease" }}>
                      {b.sets > 1
                        ? `${isDone ? b.sets : "0"} of ${b.sets} sets ${isDone?"completed":"·  tap to log"}`
                        : fmtVol(b)
                      }
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:12, alignItems:"center" }}>
                    <span style={{ fontSize:18, letterSpacing:"0.06em", color:"rgba(255,255,255,0.18)", fontWeight:700 }}>···</span>
                    <Icon name="ChevronRight" size={14} color="rgba(255,255,255,0.15)" sw={2.5}/>
                  </div>
                </button>
                {i<exs.length-1 && <div style={{ height:1, background:"var(--d-line)", margin:"0 24px" }} />}
              </div>
            );
          })}
        </div>

        {/* Bottom bar — Up next */}
        {nextIdx !== -1 && (
          <div style={{
            position:"absolute", bottom:0, left:0, right:0,
            padding:"16px 20px 32px",
            background:"var(--d-surf)",
            boxShadow:"0 -1px 0 rgba(255,255,255,0.06), 0 -20px 40px rgba(0,0,0,0.5)",
            display:"flex", alignItems:"center", gap:14,
          }}>
            <div className="ex-icon active">
              <Icon name="ChevronRight" size={18} color="var(--blue)" sw={2.5}/>
            </div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:17, fontWeight:700, color:"#fff" }}>{exs[nextIdx].ex.name}</div>
              <div style={{ fontSize:12, color:"rgba(255,255,255,0.4)", marginTop:1 }}>Up next</div>
            </div>
            <button
              className="tap"
              onClick={()=>setDone({...done,[nextIdx]:true})}
              style={{
                display:"flex", alignItems:"center", gap:8,
                padding:"11px 20px", borderRadius:30,
                background:"rgba(255,255,255,0.1)", border:"none",
                color:"#fff", fontFamily:"var(--f-sys)", fontSize:15, fontWeight:600,
                cursor:"pointer", letterSpacing:"0.02em",
              }}
            >
              Next
              <Icon name="ArrowRight" size={16} color="#fff" sw={2.2}/>
            </button>
          </div>
        )}
      </div>
    </div>
  );
};

        background: on?"var(--blue)":"rgba(120,120,128,0.2)",
        border:"none", cursor:"pointer", flexShrink:0,
        transition:"background 0.22s ease",
      }}
    >
      <div style={{
        position:"absolute", top:2, width:27, height:27,
        background:"#fff", borderRadius:14,
        left: on?"22px":"2px",
        transition:"left 0.22s cubic-bezier(0.32,0.72,0,1)",
        boxShadow:"0 2px 8px rgba(0,0,0,0.18)",
      }}/>
    </button>
  );

  const Row = ({label, value, on, onChange, last}) => (
    <>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"14px 16px" }}>
        <span style={{ fontSize:15, color:"var(--ink)" }}>{label}</span>
        {onChange ? <Toggle on={on} onChange={onChange}/> : <span style={{ fontSize:14, color:"var(--ink2)" }}>{value}</span>}
      </div>
      {!last && <div style={{ height:1, background:"var(--line)", margin:"0 16px" }}/>}
    </>
  );

  return (
    <div className="scroll">
      <div style={{ padding:"8px 24px 20px" }}>
        <div style={{ fontFamily:"var(--f-os)", fontSize:44, fontWeight:700, textTransform:"uppercase", color:"var(--ink)", lineHeight:1 }}>
          Profile
        </div>
      </div>

      {/* Identity */}
      <div style={{ margin:"0 20px 16px" }}>
        <div className="card" style={{ padding:"16px", display:"flex", alignItems:"center", gap:14 }}>
          <div style={{ width:56, height:56, borderRadius:28, background:"var(--blue-lt)", display:"flex", alignItems:"center", justifyContent:"center" }}>
            <span style={{ fontFamily:"var(--f-os)", fontSize:22, fontWeight:700, color:"var(--blue)" }}>A</span>
          </div>
          <div>
            <div style={{ fontSize:16, fontWeight:600, color:"var(--ink)" }}>Alex</div>
            <div style={{ fontSize:13, color:"var(--ink2)", marginTop:2 }}>Intermediate</div>
          </div>
        </div>
      </div>

      {[
        { title:"Goals", rows:[{label:"Weekly Target",value:"4 sessions"},{label:"Fitness Level",value:"Intermediate",last:true}]},
      ].map((sec,si)=>(
        <div key={si} style={{ margin:"0 0 16px" }}>
          <div style={{ padding:"0 24px 8px", fontSize:12, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:"var(--ink3)" }}>{sec.title}</div>
          <div style={{ margin:"0 20px" }} className="card">
            {sec.rows.map((r,ri)=><Row key={ri} {...r}/>)}
          </div>
        </div>
      ))}

      <div style={{ margin:"0 0 16px" }}>
        <div style={{ padding:"0 24px 8px", fontSize:12, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:"var(--ink3)" }}>Workout Photos</div>
        <div style={{ margin:"0 20px" }} className="card">
          <Row label="Enable Photos" on={photos} onChange={setPhotos}/>
          {photos && <Row label="Prompt at Start & End" on={prompt} onChange={setPrompt} last/>}
          {!photos && <div style={{ height:1 }}/>}
        </div>
      </div>

      <div style={{ margin:"0 0 16px" }}>
        <div style={{ padding:"0 24px 8px", fontSize:12, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:"var(--ink3)" }}>Activity</div>
        <div style={{ margin:"0 20px" }} className="card">
          <Row label="Current Streak" value="12 days"/>
          <Row label="Weekly Progress" value="2 / 4" last/>
        </div>
      </div>

      <div style={{ margin:"0 0 16px" }}>
        <div style={{ padding:"0 24px 8px", fontSize:12, fontWeight:600, letterSpacing:"0.07em", textTransform:"uppercase", color:"var(--ink3)" }}>App</div>
        <div style={{ margin:"0 20px" }} className="card">
          <Row label="Version" value="1.0.0 dev"/>
          <Row label="Account" value="Coming soon" last/>
        </div>
      </div>

      <div style={{ height:48 }}/>
    </div>
  );
};

/* ── TABS ── */
const Tabs = ({ active, onChange }) => (
  <div className="tabs">
    {[["today","Today","Home"],["schedule","Schedule","Calendar"],["profile","Profile","User"]].map(([id,label,icon])=>(
      <div key={id} className={`tab ${active===id?"on":""}`} onClick={()=>onChange(id)}>
        <Icon name={icon} size={22} sw={active===id?2.4:1.8}/>
        <span>{label}</span>
      </div>
    ))}
    <div className="hi"/>
  </div>
);

/* ── APP ── */
const App = () => {
  const [tab,    setTab]    = useState("today");
  const [active, setActive] = useState(false);
  const [month,  setMonth]  = useState(false);
  const [day,    setDay]    = useState(false);
  const [selDay, setSelDay] = useState(null);
  const [detail, setDetail] = useState(false);
  const [selWkt, setSelWkt] = useState(LEGS);

  // Persistent custom state per workout (keyed by original workout.name).
  // Renames go into customNames; edited exercise lists go into customItems.
  // Today reads both; WorkoutDetail reads and writes both.
  const [customNames, setCustomNames] = useState({});
  const [customItems, setCustomItems] = useState({});

  return (
    <>
      <SBar/>
      <div className="area">
        <div style={{ display:tab==="today"?"block":"none", height:"100%" }}>
          <TodayScreen
            customNames={customNames}
            customItems={customItems}
            onStart={()=>{ setSelWkt(LEGS); setActive(true); }}
            onOpenDetail={(w)=>{ setSelWkt(w); setDetail(true); }}
          />
        </div>
        <div style={{ display:tab==="schedule"?"block":"none", height:"100%" }}>
          <ScheduleScreen
            customNames={customNames}
            customItems={customItems}
            onOpenMonth={()=>setMonth(true)}
            onOpenDay={(d)=>{ setSelDay(d); setDay(true); }}
            onOpenDetail={(w)=>{ setSelWkt(w); setDetail(true); }}
          />
        </div>
        <div style={{ display:tab==="profile"?"block":"none", height:"100%" }}>
          <ProfileScreen/>
        </div>
      </div>

      <Tabs active={tab} onChange={setTab}/>

      <div className={`backdrop ${month?"on":""}`} onClick={()=>setMonth(false)}/>
      <MonthSheet open={month} onClose={()=>setMonth(false)}
        onSelectDay={(d)=>{ setSelDay({day:`May ${d}`,status:"completed",workout:PUSH}); setDay(true); }}/>

      <div className={`backdrop ${day?"on":""}`} onClick={()=>setDay(false)}/>
      <DaySheet open={day} day={selDay}
        customNames={customNames}
        customItems={customItems}
        onOpenDetail={(w)=>{ setDay(false); setTimeout(()=>{ setSelWkt(w); setDetail(true); }, 200); }}
        onClose={()=>setDay(false)}/>

      <WorkoutDetail open={detail} workout={selWkt}
        customNames={customNames}
        setCustomNames={setCustomNames}
        customItems={customItems}
        setCustomItems={setCustomItems}
        onClose={()=>setDetail(false)}
        onStart={()=>{ setDetail(false); setTimeout(()=>setActive(true),200); }}/>

      <ActiveWorkout open={active} workout={selWkt}
        customNames={customNames}
        customItems={customItems}
        onClose={()=>setActive(false)}/>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
